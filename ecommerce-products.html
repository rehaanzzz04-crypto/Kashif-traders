<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f35"><title>E-Commerce Products | Kashif Traders</title><link rel="stylesheet" href="/cash-sale.css?v=20260915-product-sequence1"><link rel="stylesheet" href="/ecommerce-products.css?v=20260915-products2"></head><body><header class="cs-top"><div class="cs-topin"><button class="cs-back" id="back">‹</button><div class="cs-mark">KT</div><div class="cs-brand"><b>E-Commerce Products</b><span>SEPARATE ONLINE CATALOG</span></div></div></header><main class="wrap"><nav class="store-actions" aria-label="E-commerce shortcuts"><a href="/ecommerce-orders.html">View Orders</a><a href="/ecommerce.html" target="_blank" rel="noopener">Open Store</a></nav><div class="title"><div><h1>Online Store Products</h1><p>ERP products se separate catalog, price aur stock.</p></div><button id="add">+ Add Product</button></div><div class="search"><input id="search" placeholder="Search e-commerce products..."><button id="refresh">Refresh</button></div><section id="list"><div class="empty">Products loading…</div></section></main><div class="modal hidden" id="modal"><form id="form" class="box"><div class="modal-head"><h2 id="formTitle">Add Product</h2><button type="button" id="close">×</button></div><div class="grid"><label>SKU<input name="sku" placeholder="Auto if empty"></label><label>Product Name<input name="name" required></label><label>Category<input name="category"></label><label>Unit<input name="unit" value="pcs"></label><label>Sale Price<input name="sale_price" type="number" min="0" step="0.01" required></label><label>Stock Quantity<input name="stock_quantity" type="number" min="0" step="0.001" required></label><label>Status<select name="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></label><label class="wide">Description<textarea name="description"></textarea></label><label class="wide">Product Image<input id="image" type="file" accept="image/jpeg,image/png,image/webp"><small id="imageStatus">Optional image — large photos compress automatically</small></label></div><button class="save">Save Product</button></form></div><script src="/ecommerce-products.js?v=20260915-products2"></script></body></html>
