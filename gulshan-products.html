<!doctype html>
<html lang="en">
  <head>
    <script src="/offline-sync.js?v=20260922-sync2"></script>
    <script src="/media-compress.js?v=20260922-media1"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0d1110" />
    <title>Gulshan Traders Products</title>
    <link rel="stylesheet" href="/gulshan-admin.css?v=20260922-mobile1" />
    <style>
      .title-actions {
        display: flex;
        gap: 8px;
      }
      .title-actions .secondary {
        background: #211c12;
        color: var(--gold2);
        border-color: var(--gold);
      }
      .catalog-admin {
        display: grid;
        grid-template-columns: 230px 1fr;
        gap: 14px;
      }
      .category-panel,
      .product-panel {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        padding: 12px;
      }
      .category-panel {
        position: sticky;
        top: 14px;
      }
      .panel-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .panel-title h2 {
        margin: 0;
        color: var(--gold2);
        font: 700 19px Georgia;
      }
      .panel-title button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #100f0c;
        color: var(--gold2);
        padding: 7px 9px;
        font-weight: 800;
      }
      .category-sidebar {
        display: grid;
        gap: 6px;
        margin-top: 9px;
      }
      .category-sidebar button {
        display: flex;
        justify-content: space-between;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #12110e;
        color: var(--cream);
        padding: 10px;
        font-weight: 800;
      }
      .category-sidebar button.active {
        background: var(--gold);
        color: #17130c;
      }
      .category-form {
        display: grid;
        grid-template-columns: 1.5fr 0.6fr 0.8fr auto;
        gap: 8px;
        align-items: end;
        margin: 16px 0;
      }
      .category-form label {
        font-size: 12px;
        font-weight: 800;
      }
      .category-form input,
      .category-form select {
        display: block;
        width: 100%;
        margin-top: 6px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #100f0c;
        color: #fff;
        padding: 11px;
      }
      .category-manage-list {
        display: grid;
        gap: 8px;
      }
      .category-manage-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #12110e;
        padding: 10px;
      }
      .category-manage-row small {
        display: block;
        color: var(--muted);
        margin-top: 4px;
      }
      @media (max-width: 760px) {
        .catalog-admin {
          grid-template-columns: 1fr;
        }
        .category-panel {
          position: static;
        }
        .category-sidebar {
          display: flex;
          overflow: auto;
        }
        .category-sidebar button {
          min-width: max-content;
        }
        .category-form {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 650px) {
        .title {
          flex-direction: column;
          align-items: flex-start;
        }
        .title-actions {
          width: 100%;
          display: grid;
          grid-template-columns: 1fr 1fr;
        }
        .category-form {
          grid-template-columns: 1fr;
        }
      }
      .title-actions .secondary {
        background: #fff !important;
        color: #0f6b50 !important;
        border-color: #0f6b50 !important;
      }
      .category-panel,
      .product-panel {
        border-color: #d6e2dc !important;
        background: #fff !important;
      }
      .panel-title h2 {
        color: #0b4f3c !important;
      }
      .panel-title button {
        border-color: #cfdad5 !important;
        background: #edf7f2 !important;
        color: #0b4f3c !important;
      }
      .category-sidebar button {
        border-color: #d6e2dc !important;
        background: #f1f5f3 !important;
        color: #111513 !important;
      }
      .category-sidebar button.active {
        background: #0f6b50 !important;
        color: #fff !important;
      }
      .category-form input,
      .category-form select {
        border-color: #cfdad5 !important;
        background: #fff !important;
        color: #111513 !important;
      }
      .category-manage-row {
        border-color: #d6e2dc !important;
        background: #fff !important;
      }
      .category-manage-row small {
        color: #69756f !important;
      }
      @media (max-width: 820px) {
        html,body{width:100%;max-width:100%;overflow-x:hidden}
        header{width:100%;padding-left:10px;padding-right:10px}
        header > div:last-child{min-width:0}
        header b{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        main{width:100%;max-width:none;padding:10px}
        .title{flex-direction:column;align-items:stretch}
        .title-actions{width:100%;display:grid;grid-template-columns:1fr 1fr}
        .catalog-admin{grid-template-columns:1fr}
        .category-panel{position:static;min-width:0}
        .category-sidebar{display:flex;max-width:100%;overflow-x:auto;padding-bottom:3px}
        .category-sidebar button{flex:0 0 auto;min-width:max-content}
        .product-panel{min-width:0}
        .category-form{grid-template-columns:1fr}
        .modal{place-items:end center;padding:0}
        .modal-box{width:100%;max-width:none;max-height:92dvh;border-radius:20px 20px 0 0;padding:16px 12px calc(14px + env(safe-area-inset-bottom))}
        .grid{grid-template-columns:1fr}
        .wide{grid-column:auto}
        .grid input,.grid select,.grid textarea,.category-form input,.category-form select{min-width:0;min-height:46px;font-size:16px}
        .grid input[type=file]{padding:8px;max-width:100%}
        .category-form .save,#categoryCancelEdit{width:100%;min-height:45px;margin:0}
        .category-manage-row{grid-template-columns:minmax(0,1fr)}
        .category-manage-row .row-actions button{flex:1;min-height:40px}
      }
      @media (max-width: 480px) {
        .title h1{font-size:29px}
        .search{display:grid;grid-template-columns:minmax(0,1fr) auto}
        .product-list .product{grid-template-columns:54px minmax(0,1fr);padding:10px}
        .product img,.pic{width:54px;height:54px}
        .product h3{font-size:18px}
        .price{grid-column:1/-1}
        .row-actions button{min-height:40px}
      }
    </style>
    <script defer src="/offline-register.js?v=20260922-pages2"></script>
  </head>
  <body>
    <header>
      <button id="back">‹</button>
      <div class="mark">GT</div>
      <div>
        <b>Gulshan Product Catalog</b><span>DRY FRUITS E-COMMERCE</span>
      </div>
    </header>
    <main>
      <nav class="actions">
        <a href="/gulshan-orders.html">Manage Orders</a
        ><a href="/gulshan-store.html" target="_blank">Open Store</a>
      </nav>
      <section class="title">
        <div>
          <small>SEPARATE INVENTORY</small>
          <h1>Products</h1>
        </div>
        <div class="title-actions">
          <button id="addCategory" class="secondary">+ Add Category</button
          ><button id="add">+ Add Product</button>
        </div>
      </section>
      <div class="search">
        <input id="search" placeholder="Search name, SKU or category" /><button
          id="refresh"
        >
          Refresh
        </button>
      </div>
      <div class="catalog-admin">
        <aside class="category-panel">
          <div class="panel-title">
            <h2>Categories</h2>
            <button id="categoryManageShortcut">Manage</button>
          </div>
          <div id="categorySidebar" class="category-sidebar"></div>
        </aside>
        <section class="product-list product-panel" id="list">
          <div class="empty">Products loading…</div>
        </section>
      </div>
    </main>
    <div class="modal hidden" id="modal">
      <form class="modal-box" id="form">
        <div class="modal-head">
          <h2 id="formTitle">Add Product</h2>
          <button id="close" type="button">×</button>
        </div>
        <div class="grid">
          <label>Product Name<input name="name" required /></label
          ><label>SKU<input name="sku" /></label
          ><label
            >Category<select name="category" id="productCategory">
              <option value="">General / No category</option>
            </select></label
          ><label>Unit<input name="unit" value="pack" /></label
          ><label
            >Sale Price<input
              name="sale_price"
              type="number"
              min="0"
              required /></label
          ><label
            >Available Stock<input
              name="stock_quantity"
              type="number"
              min="0"
              step="0.001"
              required /></label
          ><label
            >Status<select name="status">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select></label
          ><label
            >Product Images (up to 3)<input
              id="image"
              type="file"
              accept="image/*"
              multiple
            /><small id="imageStatus">Maximum 3 images.</small></label
          ><label class="wide"
            >Description<textarea name="description"></textarea>
          </label>
        </div>
        <button class="save">Save Product</button>
      </form>
    </div>
    <div class="modal hidden" id="categoryModal">
      <div class="modal-box">
        <div class="modal-head">
          <div>
            <h2>Categories</h2>
            <p>Add, edit ya delete categories.</p>
          </div>
          <button id="categoryClose" type="button">×</button>
        </div>
        <form id="categoryForm" class="category-form">
          <label>Name<input id="categoryName" required /></label
          ><label>Sort<input id="categorySort" type="number" value="0" /></label
          ><label
            >Status<select id="categoryStatus">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select></label
          ><button class="save" id="categorySave">Save</button
          ><button id="categoryCancelEdit" type="button" class="hidden">
            Cancel
          </button>
        </form>
        <div id="categoryManageList" class="category-manage-list"></div>
      </div>
    </div>
    <script>
      "use strict";
      (() => {
        const $ = (id) => document.getElementById(id),
          esc = (v) =>
            String(v ?? "").replace(
              /[&<>"']/g,
              (c) =>
                ({
                  "&": "&amp;",
                  "<": "&lt;",
                  ">": "&gt;",
                  '"': "&quot;",
                  "'": "&#039;",
                })[c],
            ),
          money = (v) => "PKR " + Number(v || 0).toLocaleString("en-PK");
        let rows = [],
          cats = [],
          editing = null,
          editCat = null,
          selected = "";
        async function req(u, o) {
          const r = await fetch(u, o),
            j = await r.json().catch(() => ({}));
          if (r.status === 401) {
            location.replace("/login.html");
            throw Error("Login required");
          }
          if (!r.ok) throw Error(j.error || "Request failed");
          return j;
        }
        $("back").onclick = () => (location.href = "/gulshan-orders.html");
        function fill(v = "") {
          $("productCategory").innerHTML =
            '<option value="">General / No category</option>' +
            cats
              .filter((x) => x.status === "active" || x.name === v)
              .map((x) => "<option>" + esc(x.name) + "</option>")
              .join("");
          $("productCategory").value = v;
        }
        function side() {
          const a = [{ name: "", product_count: rows.length }, ...cats];
          $("categorySidebar").innerHTML = a
            .map(
              (x) =>
                '<button data-cat="' +
                esc(x.name || "") +
                '" class="' +
                (selected === (x.name || "") ? "active" : "") +
                '">' +
                esc(x.name || "All Products") +
                " <small>" +
                Number(x.product_count || 0) +
                "</small></button>",
            )
            .join("");
          document.querySelectorAll("[data-cat]").forEach(
            (b) =>
              (b.onclick = () => {
                selected = b.dataset.cat;
                side();
                render();
              }),
          );
        }
        function render() {
          const q = $("search").value.toLowerCase(),
            list = rows.filter(
              (x) =>
                (!selected ||
                  String(x.category || "").toLowerCase() ===
                    selected.toLowerCase()) &&
                (!q ||
                  [x.name, x.sku, x.category].some((v) =>
                    String(v || "")
                      .toLowerCase()
                      .includes(q),
                  )),
            );
          $("list").innerHTML = list.length
            ? list
                .map(
                  (x) =>
                    '<article class="product">' +
                    (x.product_image_url
                      ? '<img src="' + esc(x.product_image_url) + '">'
                      : '<div class="pic">GT</div>') +
                    "<div><h3>" +
                    esc(x.name) +
                    "</h3><small>" +
                    esc(x.sku) +
                    " · " +
                    esc(x.category || "General") +
                    " · " +
                    esc(x.status) +
                    "<br>Stock: " +
                    esc(x.stock_quantity) +
                    " " +
                    esc(x.unit) +
                    '</small></div><div class="price"><b>' +
                    money(x.sale_price) +
                    '</b><div class="row-actions"><button data-edit="' +
                    x.id +
                    '">Edit</button><button class="delete" data-del="' +
                    x.id +
                    '">Delete</button></div></div></article>',
                )
                .join("")
            : '<div class="empty">No products.</div>';
          document
            .querySelectorAll("[data-edit]")
            .forEach(
              (b) =>
                (b.onclick = () =>
                  open(rows.find((x) => String(x.id) === b.dataset.edit))),
            );
          document.querySelectorAll("[data-del]").forEach(
            (b) =>
              (b.onclick = async () => {
                if (confirm("Delete product?")) {
                  await req(
                    "/api/data?resource=gulshan_ecommerce&action=products&id=" +
                      b.dataset.del,
                    { method: "DELETE" },
                  );
                  load();
                }
              }),
          );
        }
        function manage() {
          $("categoryManageList").innerHTML = cats
            .map(
              (x) =>
                '<div class="category-manage-row"><div><b>' +
                esc(x.name) +
                "</b><small>" +
                esc(x.status) +
                " · " +
                Number(x.product_count || 0) +
                ' products</small></div><div class="row-actions"><button data-ce="' +
                x.id +
                '">Edit</button><button class="delete" data-cd="' +
                x.id +
                '">Delete</button></div></div>',
            )
            .join("");
          document
            .querySelectorAll("[data-ce]")
            .forEach(
              (b) =>
                (b.onclick = () =>
                  catEdit(cats.find((x) => String(x.id) === b.dataset.ce))),
            );
          document.querySelectorAll("[data-cd]").forEach(
            (b) =>
              (b.onclick = async () => {
                try {
                  await req(
                    "/api/data?resource=gulshan_ecommerce&action=categories&id=" +
                      b.dataset.cd,
                    { method: "DELETE" },
                  );
                  load();
                } catch (e) {
                  alert(e.message);
                }
              }),
          );
        }
        function catEdit(x) {
          editCat = x || null;
          $("categoryName").value = x?.name || "";
          $("categorySort").value = x?.sort_order || 0;
          $("categoryStatus").value = x?.status || "active";
          $("categorySave").textContent = x ? "Update" : "Save";
          $("categoryCancelEdit").classList.toggle("hidden", !x);
        }
        async function load() {
          const a = await Promise.all([
            req("/api/data?resource=gulshan_ecommerce&action=products"),
            req(
              "/api/data?resource=gulshan_ecommerce&action=categories&manage=1",
            ),
          ]);
          rows = a[0].records || [];
          cats = a[1].records || [];
          side();
          render();
          fill();
          manage();
        }
        function gallery(x) {
          let a = x?.product_image_urls;
          if (typeof a === "string") {
            try {
              a = JSON.parse(a);
            } catch {
              a = [];
            }
          }
          if (!Array.isArray(a)) a = [];
          if (!a.length && x?.product_image_url) a = [x.product_image_url];
          return a.filter(Boolean).slice(0, 3);
        }
        function open(x = null) {
          editing = x;
          $("form").reset();
          fill(x?.category || "");
          for (const e of $("form").elements)
            if (e.name && e.name !== "category")
              e.value =
                x?.[e.name] ??
                (e.name === "unit"
                  ? "pack"
                  : e.name === "status"
                    ? "active"
                    : "");
          $("formTitle").textContent = x ? "Edit Product" : "Add Product";
          $("imageStatus").textContent =
            x && gallery(x).length
              ? gallery(x).length +
                " current image(s). New select karne par replace hongi."
              : "Maximum 3 images.";
          $("modal").classList.remove("hidden");
        }
        async function upload(f) {
          $("imageStatus").textContent = "Image compress ho rahi hai: " + f.name;
          const optimized = await KT_MEDIA.optimize(f);
          $("imageStatus").textContent = "Upload " + KT_MEDIA.label(optimized.size) + "…";
          const r = await fetch(
              "/api/upload-document?name=" + encodeURIComponent(optimized.name),
              { method: "POST", headers: { "Content-Type": optimized.type }, body: optimized },
            ),
            j = await r.json().catch(() => ({}));
          if (!r.ok) throw Error(j.error || "Upload failed");
          return j.url;
        }
        $("add").onclick = () => open();
        $("close").onclick = () => $("modal").classList.add("hidden");
        $("refresh").onclick = load;
        $("search").oninput = render;
        $("image").onchange = () => {
          const files = [...$("image").files], total = files.reduce((sum, file) => sum + file.size, 0);
          $("imageStatus").textContent = files.length
            ? files.length + " image(s), " + KT_MEDIA.label(total) + " — save par compress hongi."
            : "Maximum 3 images.";
        };
        $("addCategory").onclick = $("categoryManageShortcut").onclick = () => {
          $("categoryModal").classList.remove("hidden");
          catEdit(null);
        };
        $("categoryClose").onclick = () =>
          $("categoryModal").classList.add("hidden");
        $("categoryCancelEdit").onclick = () => catEdit(null);
        $("categoryForm").onsubmit = async (e) => {
          e.preventDefault();
          await req(
            "/api/data?resource=gulshan_ecommerce&action=categories" +
              (editCat ? "&id=" + editCat.id : ""),
            {
              method: editCat ? "PATCH" : "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                name: $("categoryName").value,
                sort_order: $("categorySort").value,
                status: $("categoryStatus").value,
              }),
            },
          );
          catEdit(null);
          load();
        };
        $("form").onsubmit = async (e) => {
          e.preventDefault();
          const button = e.target.querySelector(".save"),
            d = Object.fromEntries(new FormData(e.target).entries()),
            files = [...$("image").files];
          if (files.length > 3) return alert("Maximum 3 images allowed hain");
          button.disabled = true;
          try {
            if (files.length) {
              const urls = [];
              for (const f of files) urls.push(await upload(f));
              d.product_image_urls = urls;
              d.product_image_url = urls[0] || null;
            } else if (!editing) d.product_image_urls = [];
            await req(
              "/api/data?resource=gulshan_ecommerce&action=products" +
                (editing ? "&id=" + editing.id : ""),
              {method: editing ? "PATCH" : "POST",headers: { "Content-Type": "application/json" },body: JSON.stringify(d)},
            );
            $("modal").classList.add("hidden");
            await load();
          } catch (error) {
            $("imageStatus").textContent = error.message;
            alert(error.message);
          } finally { button.disabled = false; }
        };
        load();
      })();
    </script>
  </body>
</html>
