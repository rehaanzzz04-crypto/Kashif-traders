<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0c0a"><title>Gulshan Traders Dry Fruits</title><link rel="stylesheet" href="/gulshan-store.css?v=20260916-gulshan1"><style>.tools{grid-template-columns:1fr auto}.catalog-layout{display:grid;grid-template-columns:210px 1fr;gap:15px}.store-categories{position:sticky;top:88px;border:1px solid var(--line);border-radius:18px;background:#17140f;padding:12px}.store-categories h2{margin:3px 0 11px;color:var(--gold2);font:700 20px Georgia}.store-categories #categoryList{display:grid;gap:6px}.store-categories button{display:flex;justify-content:space-between;width:100%;border:1px solid var(--line);border-radius:10px;background:#211c12;color:var(--cream);padding:10px;font-weight:800}.store-categories button.active{background:var(--gold);color:#17130b}@media(max-width:760px){.catalog-layout{grid-template-columns:108px minmax(0,1fr);gap:8px;align-items:start}.store-categories{position:sticky;top:78px;padding:7px;border-radius:12px;max-height:calc(100dvh - 90px);overflow:auto}.store-categories h2{display:block;margin:2px 2px 8px;font-size:13px}.store-categories #categoryList{display:grid;gap:5px;overflow:visible}.store-categories button{display:block;width:100%;min-width:0;padding:9px 7px;border-radius:8px;text-align:left;font-size:11px;line-height:1.2;white-space:normal;overflow-wrap:anywhere}.store-categories button small{display:block;margin-top:3px;font-size:9px;opacity:.75}.products{grid-template-columns:1fr;gap:8px}.product img,.placeholder{height:135px}.product-body{padding:10px}.product h3{font-size:16px}.product-meta{display:block}.product-meta small{display:block;margin-top:4px}}@media(max-width:680px){.tools{grid-template-columns:1fr}}@media(max-width:390px){.catalog-layout{grid-template-columns:96px minmax(0,1fr);gap:7px}.store-categories button{padding:8px 6px;font-size:10px}.store-categories h2{font-size:12px}.product img,.placeholder{height:120px}}</style></head><body>
<header><a class="brand" href="#top"><span>GT</span><div><b id="brandName">Gulshan Traders</b><small>PREMIUM DRY FRUITS</small></div></a><button id="cartBtn">Bag <strong id="cartCount">0</strong></button></header><main id="top"><section class="hero"><div><small>HANDPICKED QUALITY</small><h1 id="heroName">Gulshan Traders</h1><p>Premium dry fruits, nuts and gift selections.</p></div><div class="hero-mark">GT</div></section><section class="tools"><input id="search" placeholder="Search dry fruits, nuts and gifts"><button id="searchBtn">Search</button></section><div id="storeStatus" class="notice">Products loading…</div><div class="catalog-layout"><aside class="store-categories"><h2>Categories</h2><div id="categoryList"></div></aside><section id="products" class="products"></section></div></main>
<div id="cart" class="drawer hidden"><div class="drawer-box"><div class="drawer-title"><h2>Your Bag</h2><button id="cartClose">×</button></div><div id="cartItems"></div><div class="cart-total"><span>Total</span><b id="cartTotal">PKR 0</b></div><button class="primary" id="checkoutBtn">Proceed to Checkout</button></div></div>
<div id="checkout" class="modal hidden"><form id="checkoutForm" class="modal-box"><div class="drawer-title"><h2>Checkout</h2><button type="button" id="checkoutClose">×</button></div><div class="grid"><label>Customer Name<input name="customer_name" required></label><label>Phone Number<input name="phone" required></label><label>Email<input name="email" type="email"></label><label>Order Type<select name="fulfilment_type" id="fulfilment"><option value="delivery">Delivery</option><option value="pickup">Shop Pickup</option></select></label><label class="full" id="addressLabel">Delivery Address<textarea name="delivery_address"></textarea></label><label>Payment Method<select name="payment_method" id="payment"><option>Cash on Delivery</option><option>Bank Transfer</option><option>EasyPaisa</option><option>JazzCash</option></select></label><label id="referenceLabel" class="hidden">Transaction Reference<input name="payment_reference"></label><div class="full notice hidden" id="paymentInfo"></div><label class="full">Order Notes<textarea name="notes"></textarea></label></div><div class="checkout-total"><span>Payable Total</span><b id="checkoutTotal">PKR 0</b></div><button class="primary" id="placeOrder">Place Order</button><p id="checkoutStatus"></p></form></div>
<script>'use strict';(()=>{const $=id=>document.getElementById(id),money=v=>'PKR '+Number(v||0).toLocaleString('en-PK'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let products=[],cats=[],config={},selected='',cart=JSON.parse(localStorage.getItem('gulshan_store_cart')||'{}');const pBy=id=>products.find(x=>String(x.id)===String(id)),total=()=>Object.entries(cart).reduce((n,[id,q])=>n+(pBy(id)?Number(pBy(id).sale_price)*q:0),0),save=()=>{localStorage.setItem('gulshan_store_cart',JSON.stringify(cart));renderCart()};async function get(u){const r=await fetch(u,{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Load failed');return j}function categories(){const a=[{name:'',product_count:products.length},...cats];$('categoryList').innerHTML=a.map(x=>'<button data-cat="'+esc(x.name||'')+'" class="'+(selected===(x.name||'')?'active':'')+'">'+esc(x.name||'All Categories')+' <small>'+Number(x.product_count||0)+'</small></button>').join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{selected=b.dataset.cat;categories();show()})}function show(){const q=$('search').value.toLowerCase(),list=products.filter(x=>(!selected||String(x.category||'').toLowerCase()===selected.toLowerCase())&&(!q||[x.name,x.category,x.description,x.sku].some(v=>String(v||'').toLowerCase().includes(q))));$('products').innerHTML=list.length?list.map(p=>'<article class="product">'+(p.product_image_url?'<img src="'+esc(p.product_image_url)+'">':'<div class="placeholder">GT</div>')+'<div class="product-body"><small>'+esc(p.category||'Premium Selection')+'</small><h3>'+esc(p.name)+'</h3><div class="product-meta"><b>'+money(p.sale_price)+'</b><small>'+esc(p.stock)+' '+esc(p.unit)+' available</small></div><button data-add="'+p.id+'">Add to Bag</button></div></article>').join(''):'<div class="notice">No products found.</div>';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const p=pBy(b.dataset.add),q=cart[b.dataset.add]||0;if(q>=Number(p.stock))return alert('Stock limit reached');cart[b.dataset.add]=q+1;save()})}function renderCart(){const e=Object.entries(cart).filter(([id])=>pBy(id));$('cartCount').textContent=e.reduce((n,x)=>n+x[1],0);$('cartItems').innerHTML=e.length?e.map(([id,q])=>'<div class="cart-row"><div><b>'+esc(pBy(id).name)+'</b><small>'+money(Number(pBy(id).sale_price)*q)+'</small></div><div class="qty"><button data-minus="'+id+'">−</button><b>'+q+'</b><button data-plus="'+id+'">+</button></div></div>').join(''):'<div class="notice">Your bag is empty.</div>';$('cartTotal').textContent=money(total());$('checkoutTotal').textContent=money(total()+($('fulfilment').value==='delivery'?Number(config.delivery_fee||0):0));document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{cart[b.dataset.minus]--;if(cart[b.dataset.minus]<=0)delete cart[b.dataset.minus];save()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{if(cart[b.dataset.plus]<Number(pBy(b.dataset.plus).stock)){cart[b.dataset.plus]++;save()}})}function info(){const m=$('payment').value,map={'Bank Transfer':config.bank_details,'EasyPaisa':config.easypaisa_number,'JazzCash':config.jazzcash_number};$('referenceLabel').classList.toggle('hidden',m==='Cash on Delivery');$('paymentInfo').classList.toggle('hidden',m==='Cash on Delivery');$('paymentInfo').textContent=map[m]?(m+': '+map[m]):''}async function load(){const a=await Promise.all([get('/api/data?resource=gulshan_ecommerce&action=catalog'),get('/api/data?resource=gulshan_ecommerce&action=categories'),get('/api/data?resource=gulshan_ecommerce&action=config')]);products=a[0].records||[];cats=a[1].records||[];config=a[2].record||{};$('heroName').textContent=config.store_name||'Gulshan Traders';$('brandName').textContent=config.store_name||'Gulshan Traders';categories();show();info();renderCart();$('storeStatus').classList.add('hidden')}$('searchBtn').onclick=show;$('search').oninput=show;$('cartBtn').onclick=()=>$('cart').classList.remove('hidden');$('cartClose').onclick=()=>$('cart').classList.add('hidden');$('checkoutBtn').onclick=()=>{if(Object.keys(cart).length)$('checkout').classList.remove('hidden')};$('checkoutClose').onclick=()=>$('checkout').classList.add('hidden');$('payment').onchange=info;$('fulfilment').onchange=renderCart;$('checkoutForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());d.items=Object.entries(cart).map(([product_id,qty])=>({product_id:+product_id,qty}));const r=await fetch('/api/data?resource=gulshan_ecommerce&action=order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(!r.ok)return $('checkoutStatus').textContent=j.error||'Order failed';cart={};save();$('checkoutStatus').innerHTML='Order successful!<br><strong>'+esc(j.record.invoice_number)+'</strong>'};load()})();</script></body></html>
