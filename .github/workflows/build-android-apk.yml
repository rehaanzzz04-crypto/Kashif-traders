name: Build Kashif Traders APK
on:
  push:
    branches: [ 'android/official-apk' ]
    paths: [ 'android-app/**', '.github/workflows/build-android-apk.yml' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Kashif-Traders-ERP-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kashif-Traders-ERP-v1.0
          path: Kashif-Traders-ERP-v1.0.apk
