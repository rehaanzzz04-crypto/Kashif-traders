<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>Bizora ERP — Company Workspace</title><link rel="stylesheet" href="/workspace.css"></head><body>

</header>
<div id="navBackdrop" class="navbackdrop" aria-hidden="true"></div>
<div class="shell">
