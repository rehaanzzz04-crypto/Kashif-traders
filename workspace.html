<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07112d"><title>Bizora ERP — Company Workspace</title><link rel="stylesheet" href="/workspace.css"></head><body>
<header class="topbar">
  <button id="menuToggle" class="menubtn" type="button" aria-controls="workspaceNav" aria-expanded="false">☰</button>
  <div class="bizora-logo" aria-label="Bizora"></div>
  <div class="companyHead"><strong id="companyName">Company Workspace</strong><span id="companyMeta">Loading company…</span></div>
  <div id="accessBadge" class="badge">Loading…</div>
  <button id="companyLogout" class="toplogout">Logout</button>
</header>
<div id="navBackdrop" class="navbackdrop"></div>
<nav class="sidenav" id="workspaceNav" aria-hidden="true">
  <div class="navhead"><div class="navLogo bizora-logo"></div><button id="closeMenu" type="button">×</button></div>
  <div class="navCompany"><b id="navCompany">Company</b><span>Workspace Menu</span></div>
  <button class="active" data-view="dashboard">Dashboard</button>
  <button data-view="users" id="usersNav">Users</button>
  <button data-view="suppliers">Suppliers</button>
  <button data-view="supplier-bills">Supplier Invoices</button>
  <button data-view="supplier-payments">Supplier Payments</button>
  <button data-view="clients">Customers</button>
  <button data-view="client-bills">Customer Invoices</button>
  <button data-view="client-payments">Customer Payments</button>
  <button data-view="products">Products</button>
  <button data-view="warehouses">Warehouses</button>
</nav>
<main class="shell">
  <section class="hero"><div><span class="eyebrow">BIZORA ERP</span><h1 id="workspaceTitle">Company Dashboard</h1><p id="workspaceSubtitle">Tenant-isolated ERP workspace</p></div><button id="addRecord" class="primary hidden">+ Add Record</button></section>
  <div id="readOnlyNote" class="readonly hidden"></div>
  <section id="workspaceBody"></section>
</main>
<dialog id="recordDialog"><form id="recordForm"><div class="dialoghead"><div><h2 id="recordTitle">Add Record</h2><p id="recordHint"></p></div><button type="button" id="closeRecord" class="iconbtn">×</button></div><div id="recordFields"></div><div class="actions"><button type="button" class="secondary" id="cancelRecord">Cancel</button><button class="primary" id="saveRecord">Save</button></div></form></dialog>
<script src="/workspace.js"></script></body></html>
