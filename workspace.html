<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1d4d"><title>Bizora ERP — Company Workspace</title><link rel="stylesheet" href="/workspace.css"></head><body>
<header class="topbar">
  <button id="menuToggle" class="menubtn" type="button" aria-controls="workspaceNav" aria-expanded="false">☰</button>
  <div class="bizora-logo" aria-label="Bizora"></div>
  <div class="topbarSpacer"></div>
  <div id="accessBadge" class="badge">Loading…</div>
  <div class="notificationWrap">
    <button id="notificationBell" class="notificationBell" type="button" aria-label="Notifications" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0v5l2 3H4l2-3z"/><path d="M10 20h4"/></svg>
      <span id="notificationCount" class="notificationCount hidden">0</span>
    </button>
    <div id="notificationPanel" class="notificationPanel hidden">
      <div class="notificationHead"><div><b>Notifications</b><small id="notificationHint">Bizora activity</small></div><button id="notificationRefresh" type="button" class="iconbtn" aria-label="Refresh">↻</button></div>
      <div id="notificationList" class="notificationList"><div class="notificationEmpty">Loading…</div></div>
      <button id="notificationOpenAutomation" type="button" class="notificationFooter hidden">Open Automation Center</button>
    </div>
  </div>
  <button id="companyLogout" class="toplogout">Logout</button>
</header>
<div id="navBackdrop" class="navbackdrop"></div>
<nav class="sidenav" id="workspaceNav" aria-hidden="true">
  <div class="navTop">
    <div class="navhead">
      <div class="navLogo bizora-logo" aria-label="Bizora"></div>
      <button id="closeMenu" type="button" aria-label="Close menu">×</button>
    </div>
    <div class="navCompany">
      <span class="navCompanyMark">BZ</span>
      <div><b id="navCompany">Company</b><span>Company Workspace</span></div>
    </div>
  </div>

  <div class="navScroll">
    <div class="navSection">
      <div class="navSectionTitle">Overview</div>
      <button class="active" data-view="dashboard"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5"/><path d="M5 10.5V20h14v-9.5"/><path d="M9 20v-6h6v6"/></svg></span><span class="navLabel">Dashboard</span><span class="navChevron">›</span></button>
      <button data-view="users" data-feature="core_erp" id="usersNav"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 2-6 6-6s6 2 6 6"/><circle cx="17" cy="9" r="2"/><path d="M15 14c4 0 6 2 6 6"/></svg></span><span class="navLabel">Users</span><span class="navChevron">›</span></button>
    </div>

    <div class="navSection">
      <div class="navSectionTitle">Purchasing</div>
      <button data-view="suppliers" data-feature="supplier_management"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></span><span class="navLabel">Suppliers</span><span class="navChevron">›</span></button>
      <button data-view="supplier-bills" data-feature="supplier_management"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span><span class="navLabel">Supplier Invoices</span><span class="navChevron">›</span></button>
      <button data-view="supplier-payments" data-feature="supplier_management"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M16 14h2"/></svg></span><span class="navLabel">Supplier Payments</span><span class="navChevron">›</span></button>
      <button data-view="supplier-statement" data-feature="supplier_management"><span class="navIcon"><svg viewBox="0 0 24 24"><path d="M5 3h14v18H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span><span class="navLabel">Supplier Statement</span><span class="navChevron">›</span></button>
    </div>

    <div class="navSection">
      <div class="navSectionTitle">Sales</div>
      <button data-view="clients" data-feature="customer_management"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-8 8-8s8 3 8 8"/></svg></span><span class="navLabel">Customers</span><span class="navChevron">›</span></button>
      <button data-view="client-bills" data-feature="customer_management"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span><span class="navLabel">Customer Invoices</span><span class="navChevron">›</span></button>
      <button data-view="client-payments" data-feature="customer_management"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M16 14h2"/></svg></span><span class="navLabel">Customer Payments</span><span class="navChevron">›</span></button>
      <button data-view="client-statement" data-feature="customer_management"><span class="navIcon"><svg viewBox="0 0 24 24"><path d="M5 3h14v18H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span><span class="navLabel">Customer Statement</span><span class="navChevron">›</span></button>
    </div>

    <div class="navSection">
      <div class="navSectionTitle">Inventory</div>
      <button data-view="products" data-feature="products"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l8-4 8 4-8 4z"/><path d="M4 7v10l8 4 8-4V7"/><path d="M12 11v10"/></svg></span><span class="navLabel">Products</span><span class="navChevron">›</span></button>
      <button data-view="warehouses" data-feature="warehouses"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-7 9 7v11H3z"/><path d="M8 21v-7h8v7"/></svg></span><span class="navLabel">Warehouses</span><span class="navChevron">›</span></button>
      <button data-view="grns" data-feature="grn"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/><path d="M15 16l2 2 4-4"/></svg></span><span class="navLabel">Goods Receiving (GRN)</span><span class="navChevron">›</span></button>
      <button data-view="inventory-stock" data-feature="inventory_ledger"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l8-4 8 4-8 4z"/><path d="M4 7v10l8 4 8-4V7"/><path d="M12 11v10"/></svg></span><span class="navLabel">Warehouse Stock</span><span class="navChevron">›</span></button>
      <button data-view="inventory-ledger" data-feature="inventory_ledger"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span><span class="navLabel">Inventory Ledger</span><span class="navChevron">›</span></button>
      <button data-view="stock-transfers" data-feature="inventory_ledger"><span class="navIcon"><svg viewBox="0 0 24 24"><path d="M5 7h12"/><path d="M14 4l3 3-3 3"/><path d="M19 17H7"/><path d="M10 14l-3 3 3 3"/></svg></span><span class="navLabel">Stock Transfer</span><span class="navChevron">›</span></button>
      <button data-view="stock-adjustments" data-feature="inventory_ledger"><span class="navIcon"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><path d="M5 5l14 14"/></svg></span><span class="navLabel">Stock Adjustment</span><span class="navChevron">›</span></button>
    </div>

    <div class="navSection">
      <div class="navSectionTitle">Reports & Control</div>
      <button data-view="reports" data-feature="basic_reports"><span class="navIcon"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><span class="navLabel">Business Reports</span><span class="navChevron">›</span></button>
      <button data-view="advanced-reports" data-feature="advanced_reports"><span class="navIcon"><svg viewBox="0 0 24 24"><path d="M4 18l5-5 4 3 7-9"/><path d="M15 7h5v5"/></svg></span><span class="navLabel">Advanced Reports</span><span class="navChevron">›</span></button>
      <button data-view="audit-center" data-feature="core_erp"><span class="navIcon"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3 8-8 10-5-2-8-5-8-10V7z"/><path d="M8 12l3 3 5-6"/></svg></span><span class="navLabel">Audit Service</span><span class="navChevron">›</span></button>
    </div>
  </div>

  <div class="navFooter">
    <span class="navFooterDot"></span>
    <div><b>Bizora ERP</b><span>Secure company workspace</span></div>
  </div>
</nav>
<main class="shell">
  <section class="hero">
  <div class="heroCopy">
    <span class="eyebrow">BIZORA ERP</span>
    <h1 id="workspaceTitle">Company Dashboard</h1>
    <p id="workspaceSubtitle">Tenant-isolated ERP workspace</p>
    <button id="addRecord" class="primary hidden">+ Add Record</button>
  </div>
  <div class="heroArt" aria-hidden="true">
    <div class="cityArt">
      <span class="artHalo"></span>
      <div class="building buildingA"><i></i><i></i><i></i><i></i></div>
      <div class="building buildingB"><i></i><i></i><i></i></div>
      <div class="building buildingC"><i></i><i></i></div>
      <div class="peopleBadge">●●●</div>
      <span class="tree treeA"></span><span class="tree treeB"></span>
    </div>
  </div>
</section>
  <div id="readOnlyNote" class="readonly hidden"></div>
  <section id="workspaceBody"></section>
</main>
<dialog id="recordDialog"><form id="recordForm"><div class="dialoghead"><div><h2 id="recordTitle">Add Record</h2><p id="recordHint"></p></div><button type="button" id="closeRecord" class="iconbtn">×</button></div><div id="recordFields"></div><div class="actions"><button type="button" class="secondary" id="cancelRecord">Cancel</button><button class="primary" id="saveRecord">Save</button></div></form></dialog>
<script src="/workspace.js"></script></body></html>
