<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07112d"><title>Bizora ERP — Company Login</title><link rel="stylesheet" href="/workspace.css"></head><body class="loginbody"><main class="loginbox"><div class="bizora-logo"></div><h1>Company Login</h1><p class="loginby">Bizora ERP Workspace</p><form id="companyLoginForm"><label>Company Code<input id="companyCode" autocomplete="organization" required placeholder="ABC001"></label><label>User ID or Email<input id="companyUser" autocomplete="username" required placeholder="ADMIN001"></label><label>Password<input id="companyPassword" type="password" autocomplete="current-password" required></label><button class="primary loginbtn" id="companyLoginBtn">Open Workspace</button><div id="companyLoginMessage" class="loginmessage"></div></form><p class="loginfoot">Each company opens only its own isolated ERP workspace.</p><a class="backlink" href="/login.html">Bizora Super Admin Login</a></main><script src="/company-login.js"></script></body></html>
