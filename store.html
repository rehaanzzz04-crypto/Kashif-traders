<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081a46">
  <title>Bizora Store</title>
  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/store.css">
</head>
<body class="storebody">
  <header class="storeTop">
    <div class="bizora-logo storeBizora" aria-label="Bizora"></div>
    <div class="storeTopRight"><span>Powered by Bizora</span><button id="cartToggle" type="button">Cart <b id="cartCount">0</b></button></div>
  </header>
  <main class="storeShell">
    <section class="storeHero">
      <div><span class="storeEyebrow">ONLINE STORE</span><h1 id="storeName">Loading store…</h1><p id="storeAddress">Secure ordering powered by Bizora ERP</p></div>
      <div class="storeHeroMark">BZ</div>
    </section>
    <section class="storeTools">
      <div class="storeSearch"><input id="storeSearch" placeholder="Search products…"></div>
      <div id="storeContact" class="storeContact"></div>
    </section>
    <div class="storeLayout">
      <section><div id="productGrid" class="productGrid"><div class="storeEmpty">Loading products…</div></div></section>
      <aside id="cartPanel" class="cartPanel">
        <div class="cartHead"><div><span class="storeEyebrow">YOUR CART</span><h2>Order Summary</h2></div><button id="cartClose" type="button">×</button></div>
        <div id="cartItems" class="cartItems"><div class="storeEmpty">Your cart is empty.</div></div>
        <div class="cartTotals"><div><span>Subtotal</span><b id="cartSubtotal">PKR 0</b></div><div><span>Delivery</span><b id="cartDelivery">PKR 0</b></div><div class="cartGrand"><span>Total</span><b id="cartTotal">PKR 0</b></div></div>
        <form id="checkoutForm" class="checkoutForm">
          <label>Name<input name="customer_name" required maxlength="120"></label>
          <label>Phone<input name="phone" required maxlength="40" inputmode="tel"></label>
          <label>Address<textarea name="address" maxlength="1000"></textarea></label>
          <label>Payment Method<select name="payment_method"><option value="COD">Cash on Delivery</option><option value="BANK">Bank Transfer</option><option value="EASYPAISA">EasyPaisa</option><option value="JAZZCASH">JazzCash</option><option value="ONLINE">Online</option></select></label>
          <label>Order Notes<textarea name="notes" maxlength="1000"></textarea></label>
          <input class="storeTrap" name="website" tabindex="-1" autocomplete="off">
          <button id="placeOrder" class="storePrimary">Place Order</button>
        </form>
      </aside>
    </div>
    <section id="orderSuccess" class="orderSuccess hidden"></section>
  </main>
  <footer class="storeFooter"><div class="bizora-logo storeFooterLogo" aria-label="Bizora"></div><p>Secure multi-company commerce powered by Bizora ERP.</p></footer>
  <script src="/store.js"></script>
</body>
</html>
