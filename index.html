<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Kashif Traders</title>
<style>
:root{
  --plum:#2c1835;--plum2:#4a2450;--violet:#8b3dff;--violet2:#b44fc2;
  --green:#229768;--orange:#d9921d;--rose:#d95583;--gold:#b97918;
  --bg:#fbf8fc;--card:#fff;--text:#2d2430;--muted:#817786;--line:#eee6f0;
  --shadow:0 8px 24px rgba(68,41,73,.07);--radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:270px minmax(0,1fr)}
.sidebar{height:100vh;position:sticky;top:0;overflow-y:auto;background:linear-gradient(180deg,var(--plum) 0%,var(--plum2) 100%);color:#fff;padding:20px 16px 24px;scrollbar-width:none}.sidebar::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}.brandMark{width:43px;height:43px;border-radius:13px;background:linear-gradient(145deg,var(--violet),var(--violet2));display:grid;place-items:center;font-weight:900;font-size:17px;letter-spacing:-.04em;box-shadow:0 8px 22px rgba(139,61,255,.27)}.brandText{font-size:18px;font-weight:800;line-height:1.1}.brandText small{display:block;font-size:11px;font-weight:500;color:#d7c7dd;margin-top:4px}
.navSection{margin:16px 8px 7px;color:#bba3c4;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.nav{display:grid;gap:4px}.nav button{width:100%;border:0;background:transparent;color:#eadff0;padding:11px 12px;border-radius:12px;text-align:left;display:flex;align-items:center;gap:11px;cursor:pointer;font-size:14px;transition:.16s}.nav button:hover{background:rgba(255,255,255,.07);color:#fff}.nav button.active{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;box-shadow:0 7px 18px rgba(139,61,255,.22)}.navIcon{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:13px;flex:0 0 24px}.nav button.active .navIcon{background:rgba(255,255,255,.19)}
.helpBox{margin:22px 4px 4px;padding:14px;border-radius:15px;background:linear-gradient(135deg,rgba(139,61,255,.23),rgba(217,85,131,.16));border:1px solid rgba(255,255,255,.1)}.helpBox strong{font-size:13px}.helpBox span{display:block;color:#d9c9df;font-size:11px;margin-top:3px}
.main{min-width:0}.topbar{height:74px;position:sticky;top:0;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px}.topLeft{display:flex;align-items:center;gap:12px}.menuBtn{display:none;width:42px;height:42px;border:0;border-radius:12px;background:#f4ebff;color:var(--violet);font-size:20px;font-weight:800}.pageName{font-size:20px;font-weight:800}.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:8px 11px;border-radius:999px;background:#eaf7f1;color:var(--green)}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.content{padding:24px 26px 34px;max-width:1480px;margin:0 auto}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}.hero h1{margin:0;font-size:29px;line-height:1.15;color:#35243a}.hero p{margin:6px 0 0;color:var(--muted);font-size:14px}.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.quick button{border:1px solid #e7d8ee;background:#fff;color:#6d337a;border-radius:12px;padding:10px 13px;font-size:13px;font-weight:750;box-shadow:0 3px 10px rgba(68,41,73,.04);cursor:pointer}.quick button.primary{border-color:transparent;background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.kpi{position:relative;min-height:126px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);overflow:hidden}.kpi:after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--violet))}.kpiTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.kpiLabel{font-size:12px;color:var(--muted);font-weight:650}.kpiIcon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--soft,#f4ebff);color:var(--accent,var(--violet));font-size:17px;font-weight:900}.kpiValue{font-size:27px;font-weight:850;margin-top:12px;letter-spacing:-.02em}.kpiHint{font-size:11px;color:#a69ca9;margin-top:4px}.kpi.purple{--accent:#8b3dff;--soft:#f4ebff}.kpi.green{--accent:#229768;--soft:#eaf7f1}.kpi.orange{--accent:#d9921d;--soft:#fff4df}.kpi.blue{--accent:#d95583;--soft:#fff0f5}.kpi.teal{--accent:#b97918;--soft:#fff5df}.kpi.red{--accent:#c94f5f;--soft:#fff0f2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}.panelHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.panelHead strong{font-size:15px}.panelHead span{font-size:11px;color:var(--violet);font-weight:750}.empty{min-height:92px;display:flex;align-items:center;color:var(--muted);font-size:13px}.recordRow{padding:11px 0;border-bottom:1px solid #f2edf3;font-size:13px;display:flex;justify-content:space-between;gap:12px}.recordRow:last-child{border-bottom:0}.recordRow b{font-weight:750}.recordRow span{color:var(--muted)}
.moduleHeader{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}.moduleHeader h1{margin:0;font-size:27px;color:#35243a}.moduleHeader p{margin:5px 0 0;color:var(--muted);font-size:13px}.moduleCard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}.moduleCard .empty{min-height:110px}.bottomNav{display:none}.overlay{display:none}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){body{padding-bottom:78px}.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:40;left:-292px;top:0;width:282px;height:100dvh;transition:left .2s ease;padding-top:18px}.sidebar.open{left:0}.overlay{position:fixed;z-index:30;inset:0;background:rgba(41,20,47,.55);backdrop-filter:blur(2px)}.overlay.show{display:block}.topbar{height:72px;padding:0 14px;background:linear-gradient(135deg,#7b35e8,#b34cbd);border-bottom:0;color:white}.menuBtn{display:grid;place-items:center;background:rgba(255,255,255,.17);color:#fff}.pageName{font-size:18px}.status{background:rgba(255,255,255,.17);color:#f4fff9;padding:7px 9px;font-size:10px}.content{padding:18px 14px 22px}.hero{align-items:flex-start;flex-direction:column;margin-bottom:15px}.hero h1{font-size:25px}.hero p{font-size:13px}.quick{justify-content:flex-start;width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.quick button{padding:11px 10px;text-align:center}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{min-height:112px;padding:14px;border-radius:16px}.kpiIcon{width:32px;height:32px;border-radius:10px;font-size:15px}.kpiLabel{font-size:11px;line-height:1.25}.kpiValue{font-size:21px;margin-top:10px}.kpiHint{font-size:10px}.grid2{grid-template-columns:1fr;gap:10px;margin-top:10px}.panel{border-radius:16px;padding:15px}.empty{min-height:66px}.moduleHeader{align-items:flex-start;flex-direction:column}.moduleHeader h1{font-size:24px}.bottomNav{position:fixed;z-index:25;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));height:62px;border:1px solid #eadfee;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-radius:20px;box-shadow:0 12px 30px rgba(62,29,70,.18);display:grid;grid-template-columns:1fr 1fr 56px 1fr 1fr;align-items:center;padding:0 8px}.bottomNav button{border:0;background:transparent;color:#948999;font-size:10px;font-weight:700;display:grid;gap:3px;place-items:center;padding:6px 2px}.bottomNav button span{font-size:18px}.bottomNav button.active{color:var(--violet)}.bottomNav .plus{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;font-size:25px;margin:-22px auto 0;box-shadow:0 9px 20px rgba(139,61,255,.28)}}
@media(max-width:390px){.cards{gap:8px}.kpi{padding:12px}.kpiValue{font-size:19px}.status{max-width:118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brandMark">KT</div><div class="brandText">Kashif Traders<small>Supplier & Credit Manager</small></div></div>
  <nav class="nav" id="nav">
    <div class="navSection">Main</div><button class="active" data-page="dashboard"><span class="navIcon">⌂</span>Dashboard</button>
    <div class="navSection">Suppliers</div><button data-page="suppliers"><span class="navIcon">S</span>Suppliers</button><button data-page="supplier-bills"><span class="navIcon">▤</span>Supplier Bills</button><button data-page="supplier-payments"><span class="navIcon">₨</span>Supplier Payments</button>
    <div class="navSection">Clients</div><button data-page="clients"><span class="navIcon">C</span>Clients</button><button data-page="client-sales"><span class="navIcon">↗</span>Client Credit Sales</button><button data-page="client-receipts"><span class="navIcon">✓</span>Client Payments</button>
    <div class="navSection">Business Tools</div><button data-page="documents"><span class="navIcon">▧</span>Documents</button><button data-page="search"><span class="navIcon">⌕</span>Search</button><button data-page="reports"><span class="navIcon">▥</span>Reports</button>
    <div class="navSection">System</div><button data-page="settings"><span class="navIcon">⚙</span>Settings</button>
  </nav>
  <div class="helpBox"><strong>Kashif Traders</strong><span>Independent business system • Secure Neon database</span></div>
</aside>
<main class="main"><header class="topbar"><div class="topLeft"><button class="menuBtn" id="menuBtn" aria-label="Open menu">☰</button><div class="pageName" id="pageTitle">Dashboard</div></div><span class="status" id="dbStatus">Connecting…</span></header><section class="content" id="content"></section></main>
</div>
<nav class="bottomNav" id="bottomNav"><button class="active" data-page="dashboard"><span>⌂</span>Dashboard</button><button data-page="suppliers"><span>♙</span>Suppliers</button><button class="plus" data-page="supplier-bills" aria-label="Add bill">+</button><button data-page="supplier-bills"><span>▤</span>Invoices</button><button data-page="reports"><span>•••</span>More</button></nav>
<script>
const content=document.getElementById('content'),pageTitle=document.getElementById('pageTitle'),sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay'),menuBtn=document.getElementById('menuBtn');
const titles={dashboard:'Dashboard',suppliers:'Suppliers','supplier-bills':'Supplier Bills','supplier-payments':'Supplier Payments',clients:'Clients','client-sales':'Client Credit Sales','client-receipts':'Client Payments',documents:'Documents',search:'Search',reports:'Reports',settings:'Settings'};
const kpiMeta=[['Supplier Payable','₨','purple','Outstanding to suppliers'],['Client Receivable','↙','green','Outstanding from clients'],['Supplier Purchases','▤','blue','Total supplier invoices'],['Supplier Payments','✓','orange','Payments recorded'],['Client Credit Sales','↗','teal','Total client credit sales'],['Client Payments','₨','green','Receipts recorded'],['Suppliers','S','purple','Active database records'],['Clients','C','blue','Active database records']];
function money(v){return new Intl.NumberFormat('en-PK',{style:'currency',currency:'PKR',maximumFractionDigits:0}).format(Number(v||0))}
function setActive(page){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function closeMenu(){sidebar.classList.remove('open');overlay.classList.remove('show')}
function recordHtml(rows){if(!rows?.length)return '<div class="empty">No records yet</div>';return rows.map(x=>`<div class="recordRow"><div><b>${x.invoice_number||'—'}</b><br><span>${x.business_name||''}</span></div><b>${money(x.amount)}</b></div>`).join('')}
async function loadDashboard(){content.innerHTML=`<div class="hero"><div><h1>Kashif Traders</h1><p>Payables, receivables and recent business activity</p></div><div class="quick"><button class="primary" onclick="openPage('suppliers')">+ Supplier</button><button onclick="openPage('supplier-bills')">+ Supplier Bill</button><button onclick="openPage('supplier-payments')">+ Payment</button><button onclick="openPage('clients')">+ Client</button></div></div><div class="cards" id="cards"></div><div class="grid2"><div class="panel"><div class="panelHead"><strong>Recent Supplier Bills</strong><span>Latest</span></div><div id="recentBills"><div class="empty">Loading…</div></div></div><div class="panel"><div class="panelHead"><strong>Recent Client Sales</strong><span>Latest</span></div><div id="recentSales"><div class="empty">Loading…</div></div></div></div>`;try{const r=await fetch('/api/dashboard',{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'API error');document.getElementById('dbStatus').textContent='Database connected';const vals=[d.totalSupplierPayable,d.totalClientReceivable,d.totalSupplierPurchases,d.totalSupplierPayments,d.totalClientSales,d.totalClientReceipts,d.supplierCount,d.clientCount];document.getElementById('cards').innerHTML=kpiMeta.map((m,i)=>`<div class="kpi ${m[2]}"><div class="kpiTop"><div class="kpiLabel">${m[0]}</div><div class="kpiIcon">${m[1]}</div></div><div class="kpiValue">${i<6?money(vals[i]):Number(vals[i]||0).toLocaleString()}</div><div class="kpiHint">${m[3]}</div></div>`).join('');document.getElementById('recentBills').innerHTML=recordHtml(d.recentSupplierBills);document.getElementById('recentSales').innerHTML=recordHtml(d.recentClientInvoices)}catch(e){document.getElementById('dbStatus').textContent='Database offline';document.getElementById('cards').innerHTML='<div class="kpi red"><div class="kpiTop"><div class="kpiLabel">Setup status</div><div class="kpiIcon">!</div></div><div class="kpiValue" style="font-size:17px">Database connection issue</div><div class="kpiHint">Check DATABASE_URL in Vercel</div></div>';document.getElementById('recentBills').innerHTML='<div class="empty">Unable to load records</div>';document.getElementById('recentSales').innerHTML='<div class="empty">Unable to load records</div>'}}
function modulePage(name){content.innerHTML=`<div class="moduleHeader"><div><h1>${name}</h1><p>Kashif Traders business management</p></div></div><div class="moduleCard"><div class="panelHead"><strong>${name}</strong><span>Connected</span></div><div class="empty">This module is connected to the Kashif Traders system. Functional forms and records will appear here as module wiring is completed.</div></div>`}
function openPage(page){setActive(page);pageTitle.textContent=titles[page]||page;if(page==='dashboard')loadDashboard();else modulePage(titles[page]||page);closeMenu();window.scrollTo({top:0,behavior:'instant'})}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));menuBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('show')});overlay.addEventListener('click',closeMenu);loadDashboard();
</script>
</body>
</html>
