<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Kashif Traders</title>
<style>
:root{
  --navy:#111a2d;--navy2:#171f38;--purple:#6c5ce7;--purple2:#7c6cf2;
  --teal:#16b8a6;--green:#22a06b;--orange:#f59e0b;--red:#dc5a5a;
  --bg:#f6f7fb;--card:#ffffff;--text:#1f2430;--muted:#7b8190;--line:#e8eaf1;
  --shadow:0 8px 24px rgba(31,36,48,.06);--radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:270px minmax(0,1fr)}
.sidebar{height:100vh;position:sticky;top:0;overflow-y:auto;background:linear-gradient(180deg,#11192c 0%,#171d36 100%);color:#fff;padding:20px 16px 24px;scrollbar-width:none}
.sidebar::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 18px;border-bottom:1px solid rgba(255,255,255,.09);margin-bottom:14px}
.brandMark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--purple),#8b79ff);display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:0 8px 22px rgba(108,92,231,.32)}
.brandText{font-size:18px;font-weight:800;line-height:1.1}.brandText small{display:block;font-size:11px;font-weight:500;color:#aeb6ce;margin-top:4px}
.navSection{margin:16px 8px 7px;color:#737d9d;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.nav{display:grid;gap:4px}.nav button{width:100%;border:0;background:transparent;color:#cdd3e2;padding:11px 12px;border-radius:12px;text-align:left;display:flex;align-items:center;gap:11px;cursor:pointer;font-size:14px;transition:.16s}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}.nav button.active{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;box-shadow:0 7px 18px rgba(108,92,231,.24)}
.navIcon{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:13px;flex:0 0 24px}.nav button.active .navIcon{background:rgba(255,255,255,.18)}
.helpBox{margin:22px 4px 4px;padding:14px;border-radius:15px;background:linear-gradient(135deg,rgba(108,92,231,.26),rgba(40,181,166,.12));border:1px solid rgba(255,255,255,.08)}
.helpBox strong{font-size:13px}.helpBox span{display:block;color:#b9c1d6;font-size:11px;margin-top:3px}
.main{min-width:0}
.topbar{height:74px;position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px}
.topLeft{display:flex;align-items:center;gap:12px}.menuBtn{display:none;width:42px;height:42px;border:0;border-radius:12px;background:#f0efff;color:var(--purple);font-size:20px;font-weight:800}.pageName{font-size:20px;font-weight:800}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:8px 11px;border-radius:999px;background:#eaf8f2;color:var(--green)}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.content{padding:24px 26px 34px;max-width:1480px;margin:0 auto}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}.hero h1{margin:0;font-size:29px;line-height:1.15}.hero p{margin:6px 0 0;color:var(--muted);font-size:14px}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.quick button{border:1px solid #e4e2ff;background:#fff;color:#403784;border-radius:12px;padding:10px 13px;font-size:13px;font-weight:750;box-shadow:0 3px 10px rgba(31,36,48,.035);cursor:pointer}.quick button.primary{border-color:transparent;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.kpi{position:relative;min-height:126px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);overflow:hidden}.kpi:after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--purple))}.kpiTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.kpiLabel{font-size:12px;color:var(--muted);font-weight:650}.kpiIcon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--soft,#f0efff);color:var(--accent,var(--purple));font-size:17px;font-weight:900}.kpiValue{font-size:27px;font-weight:850;margin-top:12px;letter-spacing:-.02em}.kpiHint{font-size:11px;color:#a0a5b2;margin-top:4px}
.kpi.purple{--accent:#6c5ce7;--soft:#f0efff}.kpi.green{--accent:#22a06b;--soft:#eaf8f2}.kpi.orange{--accent:#e99011;--soft:#fff5e3}.kpi.blue{--accent:#3a82f6;--soft:#ebf3ff}.kpi.teal{--accent:#16a99a;--soft:#e6f8f6}.kpi.red{--accent:#d95a66;--soft:#ffedf0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}.panelHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.panelHead strong{font-size:15px}.panelHead span{font-size:11px;color:var(--purple);font-weight:750}.empty{min-height:92px;display:flex;align-items:center;color:var(--muted);font-size:13px}.recordRow{padding:11px 0;border-bottom:1px solid #f0f1f5;font-size:13px;display:flex;justify-content:space-between;gap:12px}.recordRow:last-child{border-bottom:0}.recordRow b{font-weight:750}.recordRow span{color:var(--muted)}
.moduleHeader{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}.moduleHeader h1{margin:0;font-size:27px}.moduleHeader p{margin:5px 0 0;color:var(--muted);font-size:13px}.moduleCard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}.moduleCard .empty{min-height:110px}
.bottomNav{display:none}.overlay{display:none}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){
 body{padding-bottom:78px}.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:40;left:-292px;top:0;width:282px;height:100dvh;transition:left .2s ease;padding-top:18px}.sidebar.open{left:0}.overlay{position:fixed;z-index:30;inset:0;background:rgba(10,13,24,.58);backdrop-filter:blur(2px)}.overlay.show{display:block}
 .topbar{height:72px;padding:0 14px;background:linear-gradient(135deg,#5e50d6,#7a69ed);border-bottom:0;color:white}.menuBtn{display:grid;place-items:center;background:rgba(255,255,255,.16);color:#fff}.pageName{font-size:18px}.status{background:rgba(255,255,255,.16);color:#ecfff7;padding:7px 9px;font-size:10px}
 .content{padding:18px 14px 22px}.hero{align-items:flex-start;flex-direction:column;margin-bottom:15px}.hero h1{font-size:25px}.hero p{font-size:13px}.quick{justify-content:flex-start;width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.quick button{padding:11px 10px;text-align:center}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{min-height:112px;padding:14px;border-radius:16px}.kpiIcon{width:32px;height:32px;border-radius:10px;font-size:15px}.kpiLabel{font-size:11px;line-height:1.25}.kpiValue{font-size:21px;margin-top:10px}.kpiHint{font-size:10px}.grid2{grid-template-columns:1fr;gap:10px;margin-top:10px}.panel{border-radius:16px;padding:15px}.empty{min-height:66px}.moduleHeader{align-items:flex-start;flex-direction:column}.moduleHeader h1{font-size:24px}
 .bottomNav{position:fixed;z-index:25;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));height:62px;border:1px solid #e5e5ef;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-radius:20px;box-shadow:0 12px 30px rgba(20,25,45,.18);display:grid;grid-template-columns:1fr 1fr 56px 1fr 1fr;align-items:center;padding:0 8px}.bottomNav button{border:0;background:transparent;color:#8a8f9e;font-size:10px;font-weight:700;display:grid;gap:3px;place-items:center;padding:6px 2px}.bottomNav button span{font-size:18px}.bottomNav button.active{color:var(--purple)}.bottomNav .plus{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;font-size:25px;margin:-22px auto 0;box-shadow:0 9px 20px rgba(108,92,231,.34)}
}
@media(max-width:390px){.cards{gap:8px}.kpi{padding:12px}.kpiValue{font-size:19px}.status{max-width:118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brandMark">K</div><div class="brandText">Kashif Traders<small>Supplier & Credit Manager</small></div></div>
  <nav class="nav" id="nav">
    <div class="navSection">Main</div>
    <button class="active" data-page="dashboard"><span class="navIcon">⌂</span>Dashboard</button>
    <div class="navSection">Suppliers</div>
    <button data-page="suppliers"><span class="navIcon">S</span>Suppliers</button>
    <button data-page="supplier-bills"><span class="navIcon">▤</span>Supplier Bills</button>
    <button data-page="supplier-payments"><span class="navIcon">₨</span>Supplier Payments</button>
    <div class="navSection">Clients</div>
    <button data-page="clients"><span class="navIcon">C</span>Clients</button>
    <button data-page="client-sales"><span class="navIcon">↗</span>Client Credit Sales</button>
    <button data-page="client-receipts"><span class="navIcon">✓</span>Client Payments</button>
    <div class="navSection">Business Tools</div>
    <button data-page="documents"><span class="navIcon">▧</span>Documents</button>
    <button data-page="search"><span class="navIcon">⌕</span>Search</button>
    <button data-page="reports"><span class="navIcon">▥</span>Reports</button>
    <div class="navSection">System</div>
    <button data-page="settings"><span class="navIcon">⚙</span>Settings</button>
  </nav>
  <div class="helpBox"><strong>Kashif Traders</strong><span>Independent business system • Secure Neon database</span></div>
</aside>
<main class="main">
  <header class="topbar"><div class="topLeft"><button class="menuBtn" id="menuBtn" aria-label="Open menu">☰</button><div class="pageName" id="pageTitle">Dashboard</div></div><span class="status" id="dbStatus">Connecting…</span></header>
  <section class="content" id="content"></section>
</main>
</div>
<nav class="bottomNav" id="bottomNav">
  <button class="active" data-page="dashboard"><span>⌂</span>Dashboard</button>
  <button data-page="suppliers"><span>♙</span>Suppliers</button>
  <button class="plus" data-page="supplier-bills" aria-label="Add bill">+</button>
  <button data-page="supplier-bills"><span>▤</span>Invoices</button>
  <button data-page="reports"><span>•••</span>More</button>
</nav>
<script>
const content=document.getElementById('content');
const pageTitle=document.getElementById('pageTitle');
const sidebar=document.getElementById('sidebar');
const overlay=document.getElementById('overlay');
const menuBtn=document.getElementById('menuBtn');
const titles={dashboard:'Dashboard',suppliers:'Suppliers','supplier-bills':'Supplier Bills','supplier-payments':'Supplier Payments',clients:'Clients','client-sales':'Client Credit Sales','client-receipts':'Client Payments',documents:'Documents',search:'Search',reports:'Reports',settings:'Settings'};
const kpiMeta=[
 ['Supplier Payable','₨','purple','Outstanding to suppliers'],['Client Receivable','↙','green','Outstanding from clients'],['Supplier Purchases','▤','blue','Total supplier invoices'],['Supplier Payments','✓','orange','Payments recorded'],['Client Credit Sales','↗','teal','Total client credit sales'],['Client Payments','₨','green','Receipts recorded'],['Suppliers','S','purple','Active database records'],['Clients','C','blue','Active database records']
];
function money(v){return new Intl.NumberFormat('en-PK',{style:'currency',currency:'PKR',maximumFractionDigits:0}).format(Number(v||0))}
function setActive(page){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
function closeMenu(){sidebar.classList.remove('open');overlay.classList.remove('show')}
function recordHtml(rows,type){if(!rows?.length)return '<div class="empty">No records yet</div>';return rows.map(x=>`<div class="recordRow"><div><b>${x.invoice_number||'—'}</b><br><span>${x.business_name||''}</span></div><b>${money(x.amount)}</b></div>`).join('')}
async function loadDashboard(){
 content.innerHTML=`<div class="hero"><div><h1>Kashif Traders</h1><p>Payables, receivables and recent business activity</p></div><div class="quick"><button class="primary" onclick="openPage('suppliers')">+ Supplier</button><button onclick="openPage('supplier-bills')">+ Supplier Bill</button><button onclick="openPage('supplier-payments')">+ Payment</button><button onclick="openPage('clients')">+ Client</button></div></div><div class="cards" id="cards"></div><div class="grid2"><div class="panel"><div class="panelHead"><strong>Recent Supplier Bills</strong><span>Latest</span></div><div id="recentBills"><div class="empty">Loading…</div></div></div><div class="panel"><div class="panelHead"><strong>Recent Client Sales</strong><span>Latest</span></div><div id="recentSales"><div class="empty">Loading…</div></div></div></div>`;
 try{
   const r=await fetch('/api/dashboard',{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'API error');
   document.getElementById('dbStatus').textContent='Database connected';
   const vals=[d.totalSupplierPayable,d.totalClientReceivable,d.totalSupplierPurchases,d.totalSupplierPayments,d.totalClientSales,d.totalClientReceipts,d.supplierCount,d.clientCount];
   document.getElementById('cards').innerHTML=kpiMeta.map((m,i)=>`<div class="kpi ${m[2]}"><div class="kpiTop"><div class="kpiLabel">${m[0]}</div><div class="kpiIcon">${m[1]}</div></div><div class="kpiValue">${i<6?money(vals[i]):Number(vals[i]||0).toLocaleString()}</div><div class="kpiHint">${m[3]}</div></div>`).join('');
   document.getElementById('recentBills').innerHTML=recordHtml(d.recentSupplierBills,'bill');
   document.getElementById('recentSales').innerHTML=recordHtml(d.recentClientInvoices,'sale');
 }catch(e){
   document.getElementById('dbStatus').textContent='Database offline';
   document.getElementById('cards').innerHTML='<div class="kpi red"><div class="kpiTop"><div class="kpiLabel">Setup status</div><div class="kpiIcon">!</div></div><div class="kpiValue" style="font-size:17px">Database connection issue</div><div class="kpiHint">Check DATABASE_URL in Vercel</div></div>';
   document.getElementById('recentBills').innerHTML='<div class="empty">Unable to load records</div>';document.getElementById('recentSales').innerHTML='<div class="empty">Unable to load records</div>';
 }
}
function modulePage(name){content.innerHTML=`<div class="moduleHeader"><div><h1>${name}</h1><p>Kashif Traders business management</p></div></div><div class="moduleCard"><div class="panelHead"><strong>${name}</strong><span>Connected</span></div><div class="empty">This module is connected to the Kashif Traders system. Functional forms and records will appear here as module wiring is completed.</div></div>`}
function openPage(page){setActive(page);pageTitle.textContent=titles[page]||page;if(page==='dashboard')loadDashboard();else modulePage(titles[page]||page);closeMenu();window.scrollTo({top:0,behavior:'instant'})}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));
menuBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('show')});overlay.addEventListener('click',closeMenu);
loadDashboard();
</script>
</body>
</html>
