<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kashif Traders</title>
<style>
:root{--navy:#0d1b2a;--navy2:#13283d;--cyan:#15b8c8;--bg:#f4f7fb;--card:#fff;--text:#15202b;--muted:#6b7785;--border:#e6ebf1;--ok:#1f9d55;--warn:#d97706;--danger:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:22px;font-weight:800;padding:8px 10px 18px;border-bottom:1px solid #ffffff1e;margin-bottom:14px}.brand small{display:block;font-size:12px;font-weight:500;color:#bcd3e4;margin-top:4px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#dce7f1;padding:12px 13px;border-radius:12px;text-align:left;font-size:15px;cursor:pointer}.nav button:hover,.nav button.active{background:#ffffff15;color:#fff}.main{min-width:0}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:3}.menuBtn{display:none;border:0;background:#edf3f7;border-radius:10px;padding:10px 12px}.content{padding:24px;max-width:1400px;margin:auto}.titleRow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}.titleRow h1{margin:0;font-size:28px}.titleRow p{margin:5px 0 0;color:var(--muted)}.quick{display:flex;gap:8px;flex-wrap:wrap}.quick button{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 13px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 4px 14px #172b4d0a}.label{color:var(--muted);font-size:13px}.value{font-size:26px;font-weight:800;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.sectionTitle{font-size:16px;font-weight:800;margin-bottom:12px}.empty{color:var(--muted);padding:18px 0;font-size:14px}.status{font-size:12px;padding:5px 8px;border-radius:999px;background:#eaf8ef;color:var(--ok)}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:20;width:265px;left:-280px;transition:.2s}.sidebar.open{left:0}.menuBtn{display:inline-block}.topbar{padding:0 14px}.content{padding:16px}.cards{grid-template-columns:1fr}.titleRow{align-items:flex-start;flex-direction:column}.overlay{display:none;position:fixed;inset:0;background:#0007;z-index:10}.overlay.show{display:block}}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand">Kashif Traders<small>Supplier & Credit Manager</small></div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard">Dashboard</button>
    <button data-page="suppliers">Suppliers</button>
    <button data-page="supplier-bills">Supplier Bills</button>
    <button data-page="supplier-payments">Supplier Payments</button>
    <button data-page="clients">Clients</button>
    <button data-page="client-sales">Client Credit Sales</button>
    <button data-page="client-receipts">Client Payments</button>
    <button data-page="documents">Documents</button>
    <button data-page="search">Search</button>
    <button data-page="reports">Reports</button>
    <button data-page="settings">Settings</button>
  </nav>
</aside>
<main class="main">
  <header class="topbar"><div><button class="menuBtn" id="menuBtn">☰</button> <strong id="pageTitle">Dashboard</strong></div><span class="status" id="dbStatus">Connecting…</span></header>
  <section class="content" id="content"></section>
</main>
</div>
<script>
const content=document.getElementById('content'), pageTitle=document.getElementById('pageTitle');
const titles={dashboard:'Dashboard',suppliers:'Suppliers','supplier-bills':'Supplier Bills','supplier-payments':'Supplier Payments',clients:'Clients','client-sales':'Client Credit Sales','client-receipts':'Client Payments',documents:'Documents',search:'Search',reports:'Reports',settings:'Settings'};
function money(v){return new Intl.NumberFormat('en-PK',{style:'currency',currency:'PKR',maximumFractionDigits:0}).format(Number(v||0))}
async function loadDashboard(){
 content.innerHTML=`<div class="titleRow"><div><h1>Kashif Traders</h1><p>Payables, receivables and recent business activity</p></div><div class="quick"><button onclick="openPage('suppliers')">+ Supplier</button><button onclick="openPage('supplier-bills')">+ Supplier Bill</button><button onclick="openPage('supplier-payments')">+ Payment</button><button onclick="openPage('clients')">+ Client</button></div></div><div class="cards" id="cards"></div><div class="grid2"><div class="card"><div class="sectionTitle">Recent Supplier Bills</div><div id="recentBills" class="empty">Loading…</div></div><div class="card"><div class="sectionTitle">Recent Client Sales</div><div id="recentSales" class="empty">Loading…</div></div></div>`;
 try{const r=await fetch('/api/dashboard');const d=await r.json();if(!r.ok)throw new Error(d.error||'API error');document.getElementById('dbStatus').textContent='Database connected';document.getElementById('cards').innerHTML=[['Supplier Payable',d.totalSupplierPayable],['Client Receivable',d.totalClientReceivable],['Supplier Purchases',d.totalSupplierPurchases],['Supplier Payments',d.totalSupplierPayments],['Client Credit Sales',d.totalClientSales],['Client Payments',d.totalClientReceipts],['Suppliers',d.supplierCount],['Clients',d.clientCount]].map((x,i)=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${i<6?money(x[1]):x[1]||0}</div></div>`).join('');document.getElementById('recentBills').innerHTML=d.recentSupplierBills?.length?d.recentSupplierBills.map(x=>`<div>${x.invoice_number} · ${x.business_name} · ${money(x.amount)}</div>`).join(''):'No records yet';document.getElementById('recentSales').innerHTML=d.recentClientInvoices?.length?d.recentClientInvoices.map(x=>`<div>${x.invoice_number} · ${x.business_name} · ${money(x.amount)}</div>`).join(''):'No records yet';}catch(e){document.getElementById('dbStatus').textContent='Database not configured';document.getElementById('cards').innerHTML='<div class="card"><div class="label">Setup status</div><div class="value" style="font-size:18px">Add DATABASE_URL in Vercel</div></div>';document.getElementById('recentBills').textContent='Database connection pending';document.getElementById('recentSales').textContent='Database connection pending';}
}
function modulePage(name){content.innerHTML=`<div class="titleRow"><div><h1>${name}</h1><p>This module is part of the independent Kashif Traders system.</p></div></div><div class="card"><div class="sectionTitle">${name}</div><div class="empty">Module shell ready. Database CRUD wiring is the next implementation step.</div></div>`}
function openPage(page){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));pageTitle.textContent=titles[page]||page;if(page==='dashboard')loadDashboard();else modulePage(titles[page]||page);sidebar.classList.remove('open');overlay.classList.remove('show')}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>openPage(b.dataset.page));menuBtn.onclick=()=>{sidebar.classList.toggle('open');overlay.classList.toggle('show')};overlay.onclick=()=>{sidebar.classList.remove('open');overlay.classList.remove('show')};loadDashboard();
</script>
</body>
</html>
