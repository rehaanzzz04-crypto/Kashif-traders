<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f35"><title>Kashif Traders Login</title><link rel="stylesheet" href="/app.css?v=20260910-complete2"><style>body{min-height:100vh;display:grid;place-items:center;padding:18px}.loginwrap{width:min(460px,100%)}.loginbrand{text-align:center;margin-bottom:16px}.loginmark{width:76px;height:76px;margin:0 auto 12px;border-radius:20px;display:grid;place-items:center;background:#173f35;color:#e8d4a3;font:800 30px Georgia,serif;box-shadow:var(--shadow)}.loginbrand h1{margin:0;font:700 30px Georgia,serif}.loginbrand p{margin:7px 0 0;color:var(--muted)}.loginbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.loginbox h2{margin:0 0 6px;font:700 24px Georgia,serif}.loginbox .sub{margin:0 0 16px;color:var(--muted);font-size:13px}.loginbox .field{margin-bottom:12px}.loginbox .btn{width:100%;padding:12px}.loginmsg{min-height:22px;margin-top:10px;color:var(--danger);font-size:13px;font-weight:700}.rolehint{margin-top:13px;padding:11px;border-radius:12px;background:#f5efe1;color:#5b654f;font-size:12px;line-height:1.5}</style></head><body><main class="loginwrap"><div class="loginbrand"><div class="loginmark">KT</div><h1>Kashif Traders</h1><p>Trading & Accounts Workspace</p></div><section class="loginbox"><h2 id="title">Employee Login</h2><p class="sub" id="sub">Use your employee code and PIN.</p><form id="loginForm"><div class="field" id="nameField" style="display:none"><label>Admin Name</label><input id="fullName" autocomplete="name"></div><div class="field" id="mobileField" style="display:none"><label>Mobile Number</label><input id="mobileNumber" inputmode="tel"></div><div class="field" id="codeField"><label>Employee Code</label><input id="employeeCode" autocomplete="username" placeholder="e.g. ADM-0001"></div><div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password" placeholder="4 to 8 digits"></div><button class="btn" type="submit" id="submitBtn">Sign In</button></form><div class="loginmsg" id="msg"></div><div class="rolehint" id="hint">Admin, Manager, Accountant and Salesman accounts use designation-based access.</div></section></main><script>let bootstrap=false;const $=id=>document.getElementById(id);async function status(){try{const r=await fetch('/api/auth?action=status',{cache:'no-store'});const j=await r.json();if(j.user){location.replace('/');return;}bootstrap=!j.hasEmployees;if(bootstrap){$('title').textContent='Create First Admin';$('sub').textContent='Set up the first administrator account for Kashif Traders.';$('nameField').style.display='flex';$('mobileField').style.display='flex';$('codeField').style.display='none';$('submitBtn').textContent='Create Admin';$('hint').textContent='The first admin code will be generated automatically as ADM-0001.';}}catch(e){$('msg').textContent='Unable to connect. Please refresh.';}}$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('msg').textContent='';$('submitBtn').disabled=true;try{const payload=bootstrap?{full_name:$('fullName').value,mobile_number:$('mobileNumber').value,pin:$('pin').value}:{employee_code:$('employeeCode').value,pin:$('pin').value};const r=await fetch('/api/auth?action='+(bootstrap?'bootstrap':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Login failed');location.replace('/');}catch(err){$('msg').textContent=err.message;$('submitBtn').disabled=false;}});status();</script></body></html>
