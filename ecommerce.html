<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f34"><title>Kashif Traders Online Store</title><link rel="stylesheet" href="/ecommerce.css?v=20260915-store1"></head><body>
<header class="store-head"><div class="store-brand"><span>KT</span><div><b>Kashif Traders</b><small>ONLINE STORE</small></div></div><button id="cartBtn">Cart <strong id="cartCount">0</strong></button></header>
<main><section class="hero"><p>Quality products. Reliable supply.</p><h1>Order online from Kashif Traders</h1><span>Live ERP prices aur available stock</span></section><section class="tools"><input id="search" type="search" placeholder="Search products..."><select id="category"><option value="">All Categories</option></select><button id="searchBtn">Search</button></section><div id="storeStatus" class="notice">Products loading…</div><section id="products" class="products"></section></main>
<div id="cart" class="drawer hidden"><div class="drawer-box"><div class="drawer-title"><h2>Your Cart</h2><button id="cartClose">×</button></div><div id="cartItems"></div><div class="cart-total"><span>Total</span><b id="cartTotal">PKR 0</b></div><button class="primary" id="checkoutBtn">Proceed to Checkout</button></div></div>
<div id="checkout" class="modal hidden"><form id="checkoutForm" class="modal-box"><div class="drawer-title"><h2>Checkout</h2><button type="button" id="checkoutClose">×</button></div><div class="grid"><label>Customer Name<input name="customer_name" required></label><label>Phone Number<input name="phone" inputmode="tel" required></label><label>Email (optional)<input name="email" type="email"></label><label>Order Type<select name="fulfilment_type" id="fulfilment"><option value="delivery">Delivery</option><option value="pickup">Shop Pickup</option></select></label><label class="full" id="addressLabel">Delivery Address<textarea name="delivery_address"></textarea></label><label>Payment Method<select name="payment_method" id="payment"><option>Cash on Delivery</option><option>Bank Transfer</option><option>EasyPaisa</option><option>JazzCash</option></select></label><label id="referenceLabel" class="hidden">Transaction Reference<input name="payment_reference"></label><div class="full notice hidden" id="paymentInfo"></div><label class="full">Order Notes<textarea name="notes"></textarea></label></div><div class="checkout-total"><span>Payable Total</span><b id="checkoutTotal">PKR 0</b></div><button class="primary" id="placeOrder">Place Order</button><p id="checkoutStatus"></p></form></div>
<script src="/ecommerce.js?v=20260915-store1"></script></body></html>
