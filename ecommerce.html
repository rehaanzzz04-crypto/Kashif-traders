<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f34"><title>Kashif Traders Online Store</title><link rel="stylesheet" href="/ecommerce.css?v=20260916-store2"><style>.hero{min-height:280px}.hero-stage{position:absolute;inset:0}.hero-slide{position:absolute;inset:0}.hero-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,#071f19dd,#071f1966)}.hero-copy{position:relative;z-index:2;max-width:760px;padding:45px;text-align:left;color:#fff}.hero-copy h1{font:700 clamp(36px,7vw,68px) Georgia;margin:0}.hero-copy p{font:18px Georgia}.hero-arrow{position:absolute;top:50%;z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid #fff8;background:#10392faa;color:#fff;font-size:28px}.hero-arrow.prev{left:12px}.hero-arrow.next{right:12px}.hero-dots{position:absolute;z-index:6;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}.hero-dots button{width:8px;height:8px;border:0;border-radius:50%;background:#fff8}.hero-dots button.active{width:22px;border-radius:8px;background:#fff}.catalog-layout{display:grid;grid-template-columns:210px 1fr;gap:14px}.store-categories{position:sticky;top:86px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px}.store-categories h2{margin:3px 0 10px;font:700 20px Georgia}.store-categories #categoryList{display:grid;gap:6px}.store-categories button{display:flex;justify-content:space-between;width:100%;border:0;border-radius:10px;background:#f4f0e7;padding:10px;font-weight:800}.store-categories button.active{background:var(--green);color:#fff}@media(max-width:760px){.catalog-layout{grid-template-columns:108px minmax(0,1fr);gap:8px;align-items:start}.store-categories{position:sticky;top:76px;padding:7px;border-radius:12px;max-height:calc(100dvh - 88px);overflow:auto}.store-categories h2{display:block;margin:2px 2px 8px;font-size:13px}.store-categories #categoryList{display:grid;gap:5px;overflow:visible}.store-categories button{display:block;width:100%;min-width:0;padding:9px 7px;border-radius:8px;text-align:left;font-size:11px;line-height:1.2;white-space:normal;overflow-wrap:anywhere}.store-categories button small{display:block;margin-top:3px;font-size:9px;opacity:.75}.products{grid-template-columns:1fr;gap:8px}.product img,.product .placeholder{height:135px}.product-body{padding:10px}.product h3{font-size:16px}.product-meta{display:block}.product-meta small{display:block;margin-top:4px}.hero-copy{text-align:center;padding:28px}}@media(max-width:390px){.catalog-layout{grid-template-columns:96px minmax(0,1fr);gap:7px}.store-categories button{padding:8px 6px;font-size:10px}.store-categories h2{font-size:12px}.product img,.product .placeholder{height:120px}}.product img{cursor:zoom-in}.weight-pick{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:7px;margin-top:10px}.weight-pick label{font-size:11px;font-weight:800;color:var(--muted)}.weight-pick input{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:9px}.image-viewer{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:14px;background:#000d}.image-viewer-box{position:relative;width:min(760px,100%);max-height:94dvh;overflow:auto;border-radius:18px;background:#fff;padding:12px}.image-viewer-main{display:block;width:100%;max-height:72dvh;object-fit:contain;border-radius:12px;background:#000}.image-viewer-close,.image-viewer-nav{position:absolute;z-index:2;border:0;border-radius:999px;background:#000a;color:#fff;width:42px;height:42px;font-size:25px}.image-viewer-close{right:18px;top:18px}.image-viewer-nav{top:45%}.image-viewer-prev{left:18px}.image-viewer-next{right:18px}.image-thumbs{display:flex;justify-content:center;gap:7px;margin-top:9px}.image-thumbs button{border:2px solid transparent;border-radius:8px;background:transparent;padding:0}.image-thumbs button.active{border-color:var(--green)}.image-thumbs img{display:block;width:58px;height:58px;object-fit:cover;border-radius:6px}@media(max-width:520px){.weight-pick{grid-template-columns:1fr}.image-viewer{padding:7px}.image-viewer-box{padding:8px;border-radius:13px}.image-viewer-main{max-height:78dvh}.image-viewer-close,.image-viewer-nav{width:36px;height:36px;font-size:21px}}
.weight-pick{display:block;margin-top:10px}.weight-pick label{display:block;margin-bottom:7px;font-size:11px;font-weight:800}.weight-options{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.weight-option{min-height:40px;margin:0!important;padding:8px 5px!important;border:1px solid currentColor!important;border-radius:9px!important;background:transparent!important;font-weight:900!important}.weight-option.active{background:var(--green)!important;color:#fff!important}.weight-price{display:block;margin-top:7px;font-size:11px;font-weight:800;opacity:.82}@media(max-width:390px){.weight-options{gap:4px}.weight-option{font-size:10px!important;padding:7px 3px!important}}
</style></head><body>
<header class="store-head"><div class="store-brand"><span>KT</span><div><b id="storeBrandName">Kashif Traders</b><small>ONLINE STORE</small></div></div><button id="cartBtn">Cart <strong id="cartCount">0</strong></button></header>
<main><section class="hero"><div id="heroStage" class="hero-stage"><h1 id="storeHeroName">Kashif Traders</h1></div><button id="heroPrev" class="hero-arrow prev hidden">‹</button><button id="heroNext" class="hero-arrow next hidden">›</button><div id="heroDots" class="hero-dots"></div></section><section class="tools"><input id="search" type="search" placeholder="Search products..."><button id="searchBtn">Search</button></section><div id="storeStatus" class="notice">Products loading…</div><div class="catalog-layout"><aside class="store-categories"><h2>Categories</h2><div id="categoryList"></div></aside><section id="products" class="products"></section></div></main>
<div id="cart" class="drawer hidden"><div class="drawer-box"><div class="drawer-title"><h2>Your Cart</h2><button id="cartClose">×</button></div><div id="cartItems"></div><div class="cart-total"><span>Total</span><b id="cartTotal">PKR 0</b></div><button class="primary" id="checkoutBtn">Proceed to Checkout</button></div></div>
<div id="checkout" class="modal hidden"><form id="checkoutForm" class="modal-box"><div class="drawer-title"><h2>Checkout</h2><button type="button" id="checkoutClose">×</button></div><div class="grid"><label>Customer Name<input name="customer_name" required></label><label>Phone Number<input name="phone" required></label><label>Email<input name="email" type="email"></label><label>Order Type<select name="fulfilment_type" id="fulfilment"><option value="delivery">Delivery</option><option value="pickup">Shop Pickup</option></select></label><label class="full" id="addressLabel">Delivery Address<textarea name="delivery_address"></textarea></label><label>Payment Method<select name="payment_method" id="payment"><option>Cash on Delivery</option><option>Bank Transfer</option><option>EasyPaisa</option><option>JazzCash</option></select></label><label id="referenceLabel" class="hidden">Transaction Reference<input name="payment_reference"></label><div class="full notice hidden" id="paymentInfo"></div><label class="full">Order Notes<textarea name="notes"></textarea></label></div><div class="checkout-total"><span>Payable Total</span><b id="checkoutTotal">PKR 0</b></div><button class="primary" id="placeOrder">Place Order</button><p id="checkoutStatus"></p></form></div>
<div id="imageViewer" class="image-viewer hidden"><div class="image-viewer-box"><button id="imageViewerClose" class="image-viewer-close" type="button">×</button><button id="imageViewerPrev" class="image-viewer-nav image-viewer-prev" type="button">‹</button><img id="imageViewerMain" class="image-viewer-main" alt="Product image"><button id="imageViewerNext" class="image-viewer-nav image-viewer-next" type="button">›</button><div id="imageViewerThumbs" class="image-thumbs"></div></div></div>
<script>(()=>{const $=id=>document.getElementById(id),money=v=>'PKR '+Number(v||0).toLocaleString('en-PK',{maximumFractionDigits:2}),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),isKg=p=>['kg','kgs','kilogram','kilograms'].includes(String(p?.unit||'').trim().toLowerCase()),fmtQty=(p,q)=>isKg(p)?(Number(q).toFixed(Number(q)%1?2:0)+' kg'):String(q);let products=[],cats=[],promos=[],config={},selected='',hero=0,viewerProduct=null,viewerIndex=0,cart=JSON.parse(localStorage.getItem('kt_store_cart')||'{}');const pBy=id=>products.find(x=>String(x.id)===String(id)),total=()=>Object.entries(cart).reduce((n,[id,q])=>n+(pBy(id)?Number(pBy(id).sale_price)*Number(q):0),0),save=()=>{localStorage.setItem('kt_store_cart',JSON.stringify(cart));renderCart()};
function gallery(p){let a=p?.product_image_urls;if(typeof a==='string'){try{a=JSON.parse(a)}catch{a=[]}}if(!Array.isArray(a))a=[];if(!a.length&&p?.product_image_url)a=[p.product_image_url];return a.filter(Boolean).slice(0,3)}
async function get(u){const r=await fetch(u,{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Load failed');return j}
function categories(){const a=[{name:'',product_count:products.length},...cats];$('categoryList').innerHTML=a.map(x=>'<button data-cat="'+esc(x.name||'')+'" class="'+(selected===(x.name||'')?'active':'')+'">'+esc(x.name||'All Categories')+' <small>'+Number(x.product_count||0)+'</small></button>').join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{selected=b.dataset.cat;categories();show()})}
function weightInput(p){return isKg(p)?'<div class="weight-pick"><label>Select Weight</label><div class="weight-options"><button type="button" class="weight-option" data-weight-option="'+p.id+'" data-qty="0.25">250g</button><button type="button" class="weight-option" data-weight-option="'+p.id+'" data-qty="0.5">500g</button><button type="button" class="weight-option" data-weight-option="'+p.id+'" data-qty="1">1kg</button></div><small class="weight-price" data-weight-price="'+p.id+'">Weight select karein</small></div>':''}
function show(){const q=$('search').value.toLowerCase(),list=products.filter(x=>(!selected||String(x.category||'').toLowerCase()===selected.toLowerCase())&&(!q||[x.name,x.category,x.description,x.sku].some(v=>String(v||'').toLowerCase().includes(q))));$('products').innerHTML=list.length?list.map(p=>'<article class="product">'+(gallery(p).length?'<img data-view="'+p.id+'" src="'+esc(gallery(p)[0])+'" alt="'+esc(p.name)+'">':'<div class="placeholder">KT</div>')+'<div class="product-body"><small>'+esc(p.category||'General')+'</small><h3>'+esc(p.name)+'</h3><div class="product-meta"><b>'+money(p.sale_price)+'</b></div>'+weightInput(p)+'<button data-add="'+p.id+'">Add to Cart</button></div></article>').join(''):'<div class="notice">No products found.</div>';document.querySelectorAll('[data-view]').forEach(img=>img.onclick=()=>openViewer(pBy(img.dataset.view),0));document.querySelectorAll('[data-weight-option]').forEach(btn=>btn.onclick=()=>{const p=pBy(btn.dataset.weightOption);if(!p)return;document.querySelectorAll('[data-weight-option="'+p.id+'"]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const qty=Number(btn.dataset.qty),price=document.querySelector('[data-weight-price="'+p.id+'"]');if(price)price.textContent=(qty<1?Math.round(qty*1000)+'g':'1kg')+' · '+money(Number(p.sale_price)*qty)});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const p=pBy(b.dataset.add);if(!p)return;let add=1;if(isKg(p)){const selectedWeight=document.querySelector('[data-weight-option="'+p.id+'"].active');if(!selectedWeight)return alert('250g, 500g ya 1kg select karein.');add=Number(selectedWeight.dataset.qty)}const next=Number(((Number(cart[p.id])||0)+add).toFixed(3));if(next>Number(p.stock))return alert('Selected quantity available nahi hai.');cart[p.id]=next;save()})}
function openViewer(p,index=0){const imgs=gallery(p);if(!imgs.length)return;viewerProduct=p;viewerIndex=Math.max(0,Math.min(index,imgs.length-1));renderViewer();$('imageViewer').classList.remove('hidden')}
function renderViewer(){const imgs=gallery(viewerProduct);if(!imgs.length)return;$('imageViewerMain').src=imgs[viewerIndex];$('imageViewerPrev').classList.toggle('hidden',imgs.length<2);$('imageViewerNext').classList.toggle('hidden',imgs.length<2);$('imageViewerThumbs').innerHTML=imgs.map((u,i)=>'<button type="button" data-thumb="'+i+'" class="'+(i===viewerIndex?'active':'')+'"><img src="'+esc(u)+'"></button>').join('');document.querySelectorAll('[data-thumb]').forEach(b=>b.onclick=()=>{viewerIndex=Number(b.dataset.thumb);renderViewer()})}
function renderCart(){const e=Object.entries(cart).filter(([id])=>pBy(id));$('cartCount').textContent=e.length;$('cartItems').innerHTML=e.length?e.map(([id,q])=>{const p=pBy(id),step=isKg(p)?.25:1;return '<div class="cart-row"><div><b>'+esc(p.name)+'</b><small>'+fmtQty(p,q)+' · '+money(Number(p.sale_price)*Number(q))+'</small></div><div class="qty"><button data-minus="'+id+'">−</button><b>'+fmtQty(p,q)+'</b><button data-plus="'+id+'">+</button></div></div>'}).join(''):'<div class="notice">Cart empty hai.</div>';$('cartTotal').textContent=money(total());$('checkoutTotal').textContent=money(total()+($('fulfilment').value==='delivery'?Number(config.delivery_fee||0):0));document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const p=pBy(b.dataset.minus),step=isKg(p)?.25:1,next=Number((Number(cart[b.dataset.minus])-step).toFixed(3));if(next<(isKg(p)?.25:1))delete cart[b.dataset.minus];else cart[b.dataset.minus]=next;save()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{const p=pBy(b.dataset.plus),step=isKg(p)?.25:1,next=Number((Number(cart[b.dataset.plus])+step).toFixed(3));if(next<=Number(p.stock)){cart[b.dataset.plus]=next;save()}else alert('Selected quantity available nahi hai.')})}
function heroRender(){const name=config.store_name||'Kashif Traders';if(!promos.length){$('heroStage').innerHTML='<h1 id="storeHeroName">'+esc(name)+'</h1>';$('heroPrev').classList.add('hidden');$('heroNext').classList.add('hidden');return}hero=(hero+promos.length)%promos.length;const p=promos[hero],m=p.media_type==='video'?'<video class="hero-media" src="'+esc(p.media_url)+'" autoplay muted loop playsinline></video>':'<img class="hero-media" src="'+esc(p.media_url)+'">';$('heroStage').innerHTML='<div class="hero-slide">'+m+'<div class="hero-shade"></div><div class="hero-copy"><h1>'+esc(p.title||name)+'</h1><p>'+esc(p.subtitle||'')+'</p></div></div>';$('heroPrev').classList.toggle('hidden',promos.length<2);$('heroNext').classList.toggle('hidden',promos.length<2);$('heroDots').innerHTML=promos.map((_,i)=>'<button data-h="'+i+'" class="'+(i===hero?'active':'')+'"></button>').join('');document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{hero=+b.dataset.h;heroRender()})}function payInfo(){const m=$('payment').value,map={'Bank Transfer':config.bank_details,'EasyPaisa':config.easypaisa_number,'JazzCash':config.jazzcash_number};$('referenceLabel').classList.toggle('hidden',m==='Cash on Delivery');$('paymentInfo').classList.toggle('hidden',m==='Cash on Delivery');$('paymentInfo').textContent=map[m]?(m+': '+map[m]):''}
async function load(){const a=await Promise.all([get('/api/data?resource=ecommerce&action=catalog'),get('/api/data?resource=ecommerce&action=categories'),get('/api/data?resource=ecommerce&action=promotions'),get('/api/data?resource=ecommerce&action=config')]);products=a[0].records||[];cats=a[1].records||[];promos=a[2].records||[];config=a[3].record||{};$('storeBrandName').textContent=config.store_name||'Kashif Traders';categories();show();heroRender();payInfo();renderCart();$('storeStatus').classList.add('hidden')}
$('imageViewerClose').onclick=()=>$('imageViewer').classList.add('hidden');$('imageViewer').onclick=e=>{if(e.target===$('imageViewer'))$('imageViewer').classList.add('hidden')};$('imageViewerPrev').onclick=()=>{const n=gallery(viewerProduct).length;if(n){viewerIndex=(viewerIndex-1+n)%n;renderViewer()}};$('imageViewerNext').onclick=()=>{const n=gallery(viewerProduct).length;if(n){viewerIndex=(viewerIndex+1)%n;renderViewer()}};
$('heroPrev').onclick=()=>{hero--;heroRender()};$('heroNext').onclick=()=>{hero++;heroRender()};$('searchBtn').onclick=show;$('search').oninput=show;$('cartBtn').onclick=()=>$('cart').classList.remove('hidden');$('cartClose').onclick=()=>$('cart').classList.add('hidden');$('checkoutBtn').onclick=()=>{if(Object.keys(cart).length)$('checkout').classList.remove('hidden')};$('checkoutClose').onclick=()=>$('checkout').classList.add('hidden');$('payment').onchange=payInfo;$('fulfilment').onchange=renderCart;$('checkoutForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());d.items=Object.entries(cart).map(([product_id,qty])=>({product_id:+product_id,qty:Number(qty)}));const r=await fetch('/api/data?resource=ecommerce&action=order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(!r.ok)return $('checkoutStatus').textContent=j.error||'Order failed';cart={};save();$('checkoutStatus').innerHTML='Order successful!<br><strong>'+esc(j.record.invoice_number)+'</strong>'};load()})();</script></body></html>
