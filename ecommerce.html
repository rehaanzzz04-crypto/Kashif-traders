<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f34"><title>Kashif Traders Online Store</title><link rel="stylesheet" href="/ecommerce.css?v=20260916-store2"><style>.hero{min-height:280px}.hero-stage{position:absolute;inset:0}.hero-slide{position:absolute;inset:0}.hero-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,#071f19dd,#071f1966)}.hero-copy{position:relative;z-index:2;max-width:760px;padding:45px;text-align:left;color:#fff}.hero-copy h1{font:700 clamp(36px,7vw,68px) Georgia;margin:0}.hero-copy p{font:18px Georgia}.hero-arrow{position:absolute;top:50%;z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid #fff8;background:#10392faa;color:#fff;font-size:28px}.hero-arrow.prev{left:12px}.hero-arrow.next{right:12px}.hero-dots{position:absolute;z-index:6;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}.hero-dots button{width:8px;height:8px;border:0;border-radius:50%;background:#fff8}.hero-dots button.active{width:22px;border-radius:8px;background:#fff}.catalog-layout{display:grid;grid-template-columns:210px 1fr;gap:14px}.store-categories{position:sticky;top:86px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px}.store-categories h2{margin:3px 0 10px;font:700 20px Georgia}.store-categories #categoryList{display:grid;gap:6px}.store-categories button{display:flex;justify-content:space-between;width:100%;border:0;border-radius:10px;background:#f4f0e7;padding:10px;font-weight:800}.store-categories button.active{background:var(--green);color:#fff}@media(max-width:760px){.catalog-layout{grid-template-columns:1fr}.store-categories{position:static}.store-categories h2{display:none}.store-categories #categoryList{display:flex;overflow:auto}.store-categories button{width:auto;min-width:max-content}.hero-copy{text-align:center;padding:28px}}</style></head><body>
<header class="store-head"><div class="store-brand"><span>KT</span><div><b id="storeBrandName">Kashif Traders</b><small>ONLINE STORE</small></div></div><button id="cartBtn">Cart <strong id="cartCount">0</strong></button></header>
<main><section class="hero"><div id="heroStage" class="hero-stage"><h1 id="storeHeroName">Kashif Traders</h1></div><button id="heroPrev" class="hero-arrow prev hidden">‹</button><button id="heroNext" class="hero-arrow next hidden">›</button><div id="heroDots" class="hero-dots"></div></section><section class="tools"><input id="search" type="search" placeholder="Search products..."><button id="searchBtn">Search</button></section><div id="storeStatus" class="notice">Products loading…</div><div class="catalog-layout"><aside class="store-categories"><h2>Categories</h2><div id="categoryList"></div></aside><section id="products" class="products"></section></div></main>
<div id="cart" class="drawer hidden"><div class="drawer-box"><div class="drawer-title"><h2>Your Cart</h2><button id="cartClose">×</button></div><div id="cartItems"></div><div class="cart-total"><span>Total</span><b id="cartTotal">PKR 0</b></div><button class="primary" id="checkoutBtn">Proceed to Checkout</button></div></div>
<div id="checkout" class="modal hidden"><form id="checkoutForm" class="modal-box"><div class="drawer-title"><h2>Checkout</h2><button type="button" id="checkoutClose">×</button></div><div class="grid"><label>Customer Name<input name="customer_name" required></label><label>Phone Number<input name="phone" required></label><label>Email<input name="email" type="email"></label><label>Order Type<select name="fulfilment_type" id="fulfilment"><option value="delivery">Delivery</option><option value="pickup">Shop Pickup</option></select></label><label class="full" id="addressLabel">Delivery Address<textarea name="delivery_address"></textarea></label><label>Payment Method<select name="payment_method" id="payment"><option>Cash on Delivery</option><option>Bank Transfer</option><option>EasyPaisa</option><option>JazzCash</option></select></label><label id="referenceLabel" class="hidden">Transaction Reference<input name="payment_reference"></label><div class="full notice hidden" id="paymentInfo"></div><label class="full">Order Notes<textarea name="notes"></textarea></label></div><div class="checkout-total"><span>Payable Total</span><b id="checkoutTotal">PKR 0</b></div><button class="primary" id="placeOrder">Place Order</button><p id="checkoutStatus"></p></form></div>
<script>
(()=>{const $=id=>document.getElementById(id),money=v=>'PKR '+Number(v||0).toLocaleString('en-PK'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let products=[],cats=[],promos=[],config={},selected='',hero=0,cart=JSON.parse(localStorage.getItem('kt_store_cart')||'{}');const pBy=id=>products.find(x=>String(x.id)===String(id)),total=()=>Object.entries(cart).reduce((n,[id,q])=>n+(pBy(id)?Number(pBy(id).sale_price)*q:0),0),save=()=>{localStorage.setItem('kt_store_cart',JSON.stringify(cart));renderCart()};
async function get(url){const r=await fetch(url,{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Load failed');return j}
function categories(){const a=[{name:'',product_count:products.length},...cats];$('categoryList').innerHTML=a.map(x=>'<button data-cat="'+esc(x.name||'')+'" class="'+(selected===(x.name||'')?'active':'')+'">'+esc(x.name||'All Categories')+' <small>'+Number(x.product_count||0)+'</small></button>').join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{selected=b.dataset.cat;categories();show()})}
function show(){const q=$('search').value.toLowerCase(),list=products.filter(x=>(!selected||String(x.category||'').toLowerCase()===selected.toLowerCase())&&(!q||[x.name,x.category,x.description,x.sku].some(v=>String(v||'').toLowerCase().includes(q))));$('products').innerHTML=list.length?list.map(p=>'<article class="product">'+(p.product_image_url?'<img src="'+esc(p.product_image_url)+'">':'<div class="placeholder">KT</div>')+'<div class="product-body"><small>'+esc(p.category||'General')+'</small><h3>'+esc(p.name)+'</h3><div class="product-meta"><b>'+money(p.sale_price)+'</b><small>'+esc(p.stock)+' '+esc(p.unit)+' available</small></div><button data-add="'+p.id+'">Add to Cart</button></div></article>').join(''):'<div class="notice">No products found.</div>';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const p=pBy(b.dataset.add),q=cart[b.dataset.add]||0;if(q>=Number(p.stock))return alert('Stock limit reached');cart[b.dataset.add]=q+1;save()})}
function heroRender(){const name=config.store_name||'Kashif Traders';if(!promos.length){$('heroStage').innerHTML='<h1 id="storeHeroName">'+esc(name)+'</h1>';$('heroPrev').classList.add('hidden');$('heroNext').classList.add('hidden');return}hero=(hero+promos.length)%promos.length;const p=promos[hero],m=p.media_type==='video'?'<video class="hero-media" src="'+esc(p.media_url)+'" autoplay muted loop playsinline></video>':'<img class="hero-media" src="'+esc(p.media_url)+'">';$('heroStage').innerHTML='<div class="hero-slide">'+m+'<div class="hero-shade"></div><div class="hero-copy"><h1>'+esc(p.title||name)+'</h1><p>'+esc(p.subtitle||'')+'</p></div></div>';$('heroPrev').classList.toggle('hidden',promos.length<2);$('heroNext').classList.toggle('hidden',promos.length<2);$('heroDots').innerHTML=promos.map((_,i)=>'<button data-h="'+i+'" class="'+(i===hero?'active':'')+'"></button>').join('');document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{hero=+b.dataset.h;heroRender()})}
function renderCart(){const entries=Object.entries(cart).filter(([id])=>pBy(id));$('cartCount').textContent=entries.reduce((n,x)=>n+x[1],0);$('cartItems').innerHTML=entries.length?entries.map(([id,q])=>'<div class="cart-row"><div><b>'+esc(pBy(id).name)+'</b><small>'+money(Number(pBy(id).sale_price)*q)+'</small></div><div class="qty"><button data-minus="'+id+'">−</button><b>'+q+'</b><button data-plus="'+id+'">+</button></div></div>').join(''):'<div class="notice">Cart empty hai.</div>';$('cartTotal').textContent=money(total());$('checkoutTotal').textContent=money(total()+($('fulfilment').value==='delivery'?Number(config.delivery_fee||0):0));document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{cart[b.dataset.minus]--;if(cart[b.dataset.minus]<=0)delete cart[b.dataset.minus];save()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{if(cart[b.dataset.plus]<Number(pBy(b.dataset.plus).stock)){cart[b.dataset.plus]++;save()}})}
function payInfo(){const m=$('payment').value,map={'Bank Transfer':config.bank_details,'EasyPaisa':config.easypaisa_number,'JazzCash':config.jazzcash_number};$('referenceLabel').classList.toggle('hidden',m==='Cash on Delivery');$('paymentInfo').classList.toggle('hidden',m==='Cash on Delivery');$('paymentInfo').textContent=map[m]?(m+': '+map[m]):''}
async function load(){const a=await Promise.all([get('/api/data?resource=ecommerce&action=catalog'),get('/api/data?resource=ecommerce&action=categories'),get('/api/data?resource=ecommerce&action=promotions'),get('/api/data?resource=ecommerce&action=config')]);products=a[0].records||[];cats=a[1].records||[];promos=a[2].records||[];config=a[3].record||{};$('storeBrandName').textContent=config.store_name||'Kashif Traders';categories();show();heroRender();payInfo();renderCart();$('storeStatus').classList.add('hidden')}
$('heroPrev').onclick=()=>{hero--;heroRender()};$('heroNext').onclick=()=>{hero++;heroRender()};$('searchBtn').onclick=show;$('search').oninput=show;$('cartBtn').onclick=()=>$('cart').classList.remove('hidden');$('cartClose').onclick=()=>$('cart').classList.add('hidden');$('checkoutBtn').onclick=()=>{if(Object.keys(cart).length)$('checkout').classList.remove('hidden')};$('checkoutClose').onclick=()=>$('checkout').classList.add('hidden');$('fulfilment').onchange=renderCart;$('payment').onchange=payInfo;$('checkoutForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());data.items=Object.entries(cart).map(([product_id,qty])=>({product_id:+product_id,qty}));const r=await fetch('/api/data?resource=ecommerce&action=order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)return $('checkoutStatus').textContent=j.error||'Order failed';cart={};save();$('checkoutStatus').innerHTML='Order successful!<br><strong>'+esc(j.record.invoice_number)+'</strong>'};load()})();
</script></body></html>
